<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Förändring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;600;800&display=swap">
<style>
/* Stage 1: the definition and the triangle. Stage 2: examples worked with a small triangle.
   Purple = andel, orange = del, blue = hel, green = highlighting and the step being done. */
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#172031; --mute:#7D879A; --rule:#D3D9E2; --dim:rgba(16,22,34,.16);
  --cA:#DD5F0B; --cB:#2357D4; --cF:#0E8A5A; --cO:#7A3FD8;
  --font:'Azeret Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1015; --panel:#161A21; --ink:#E6E9EF; --mute:#77839A; --rule:#2B323E; --dim:rgba(0,0,0,.45);
  --cA:#FF8A42; --cB:#6E97FF; --cF:#34C98A; --cO:#B08CFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1015; --panel:#161A21; --ink:#E6E9EF; --mute:#77839A; --rule:#2B323E; --dim:rgba(0,0,0,.45);
  --cA:#FF8A42; --cB:#6E97FF; --cF:#34C98A; --cO:#B08CFF; color-scheme:dark}

body{margin:0;font-size:14px;background:var(--bg);color:var(--ink);font-family:var(--font)}
[hidden]{display:none!important}
.wrap{max-width:936px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:36px 72px;display:flex;flex-direction:column;gap:44px}
.top{display:flex;flex-direction:column;align-items:center;gap:18px}
.titles{text-align:center}
.titles h1{font:800 clamp(28px,5.5vw,46px)/1.1 var(--font);margin:0;letter-spacing:-.01em;text-wrap:balance}
.titles .by{margin:8px 0 0;font-size:15px;color:var(--mute);letter-spacing:.02em}
.dimmer{position:fixed;inset:0;background:var(--dim);opacity:0;pointer-events:none;transition:opacity 2s;z-index:1}
body.focusing .dimmer{opacity:1}
.top,.sec,.note{position:relative;transition:opacity 2s}
body.focusing .dimmer,body.focusing .top,body.focusing .sec,body.focusing .note{transition-duration:.9s}
body.focusing .top,body.focusing .sec:not(.active),body.focusing .note{opacity:.4}
.sec.active{z-index:2}
.ops{font-size:clamp(48px,11vw,96px);font-weight:800;letter-spacing:.12em;line-height:1}
.legend{display:flex;justify-content:center}
.legend svg{width:min(380px,100%);height:auto}
.dmbox{display:flex;flex-direction:column;align-items:center;gap:6px}
.dmbox .q{font:800 18px/1 var(--font);color:var(--mute)}
.dmbox div{display:flex;gap:8px}
.dmbox button{font:600 15px/1 var(--font);padding:7px 11px;border-radius:12px;border:1.5px solid var(--rule);background:var(--panel);color:var(--ink);cursor:pointer}
.dmbox button[aria-pressed="true"]{border:2px solid var(--ink)}
.sec{display:grid;grid-template-columns:152px minmax(0,1fr);gap:16px;align-items:start}
.glyph{display:flex;justify-content:center;padding-top:10px}
.glyph svg{width:80px;height:72px}
@media (max-width:640px){.sec{grid-template-columns:minmax(0,1fr)}.glyph{justify-content:flex-start;padding-top:0}.glyph svg{width:56px;height:50px}}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:16px;overflow:hidden;min-width:0}
svg.stage{display:block;width:100%;height:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-top:1px solid var(--rule);align-items:center}
.exs{display:flex;flex-wrap:wrap;gap:8px;flex:1;min-width:0}
.card button{font:600 17px/1 var(--font);padding:9px 16px;border-radius:14px;border:1.5px solid var(--rule);background:var(--panel);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:opacity .6s,filter .6s,border-color .3s}
.card button:hover:not(:disabled){border-color:var(--mute)}
.card button.on{border:2px solid var(--ink)}
.card button:disabled{opacity:.3;filter:grayscale(1);cursor:not-allowed}
.bar .replay{font-size:22px;padding:8px 14px;align-self:stretch;min-width:52px}
.ctl{display:grid;grid-template-columns:auto auto;gap:8px;align-self:stretch}
.ctl[hidden]{display:none}
.ctl .replay{min-height:44px}
.ctl .spd{font-size:15px;font-variant-numeric:tabular-nums;width:64px;padding-left:0;padding-right:0}
.ctl .skip svg{width:22px;height:16px}
.bar .pp[aria-pressed="true"]{border:2px solid var(--cF);color:var(--cF)}
button:focus-visible{outline:3px solid var(--cB);outline-offset:2px}
.kA{color:var(--cA)} .kB{color:var(--cB)} .kO{color:var(--cO)}
/* stage 2 buttons */
.meth{display:flex;flex-direction:column;gap:8px;padding-right:12px;margin-right:4px;border-right:1px solid var(--rule);align-self:stretch;justify-content:center}
.meth button{padding:7px 12px;min-width:64px}
.meth button[aria-pressed="true"]{border:2px solid var(--ink)}
.exs2{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.erow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.erow .ric{width:34px;height:30px;flex:none}
.card .exs2 button{font-size:15px;padding:7px 12px;min-height:44px}
.card button svg{display:block}
.mf{display:inline-flex;flex-direction:column;align-items:center;line-height:1;font-size:.85em}
.mf>span:first-child{border-bottom:1.5px solid currentColor;padding:0 2px 2px}
.mf>span:last-child{padding:2px 2px 0}

svg text{font-family:var(--font);font-weight:600}
.w{fill:var(--ink);font-size:26px;transition:fill .5s}
.w.cA{fill:var(--cA)} .w.cB{fill:var(--cB)} .w.cO{fill:var(--cO)} .w.cF{fill:var(--cF)} .w.hot{fill:var(--cF)}
.bl{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;transition:stroke .5s,stroke-width .5s}
.bl.hot{stroke:var(--cF);stroke-width:5}
.tri{fill:none;stroke:var(--mute);stroke-width:2;stroke-linejoin:round}
.ring{fill:none;stroke:var(--cF);stroke-width:2.5}
.whole{fill:none;stroke:var(--cB);stroke-width:2.5}
.dt{fill:var(--ink);transition:fill .6s}
.dt.cA{fill:var(--cA)} .dt.cB{fill:var(--cB)} .dt.cO{fill:var(--cO)}
.pieb{fill:var(--panel)}
.pies{fill:var(--mute);fill-opacity:.45;transition:fill .6s,fill-opacity .6s}
.pies.cO{fill:var(--cO);fill-opacity:.85}
.piel{stroke:var(--ink);stroke-width:1;stroke-opacity:.5}
.pieo{fill:none;stroke:var(--ink);stroke-width:1.6}
.cbody{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}
.cdisp{fill:var(--panel);stroke:var(--rule);stroke-width:1.5}
.ckey{fill:var(--panel);stroke:var(--rule);stroke-width:1.2}
.cexp{fill:var(--mute);font-size:13px}
.lg text{font-size:15px}
.lg .t{fill:var(--ink)} .lg .tA{fill:var(--cA)} .lg .tB{fill:var(--cB)} .lg .tO{fill:var(--cO)}
.lg .cell{fill:var(--cA);fill-opacity:.85}
.lg .out{fill:none;stroke:var(--ink);stroke-width:1.5}
.lg .cut{stroke:var(--mute);stroke-width:1}
.lg .brA{fill:none;stroke:var(--cA);stroke-width:1.5}
.lg .brB{fill:none;stroke:var(--cB);stroke-width:1.5}
.lg .fb{stroke:var(--ink);stroke-width:1.5}
.gl{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.gt{font-family:var(--font);font-weight:800;font-size:15px}
.gt.a{fill:var(--cO)} .gt.d{fill:var(--cA)} .gt.h{fill:var(--cB)} .gt.m{fill:var(--mute)}
.gd{fill:var(--ink)} .gd.a{fill:var(--cA)}
.home{align-self:flex-start;margin-bottom:-24px;font:600 14px/1 var(--font);padding:9px 14px;border-radius:14px;border:1.5px solid var(--rule);background:var(--panel);color:var(--ink);text-decoration:none;position:relative;transition:opacity 2s,border-color .3s}
.home:hover{border-color:var(--mute)}
.home:focus-visible{outline:3px solid var(--cB);outline-offset:2px}
body.focusing .home{opacity:.4;transition-duration:.9s}
.note{max-width:62ch;margin:0 auto;text-align:center;font-size:13px;line-height:1.6;color:var(--mute)}
.note p{margin:0}
.cn{stroke:var(--mute);stroke-width:1.6;stroke-linecap:round}
.bl.cF{stroke:var(--cF)}
.sgn{fill:none;stroke:var(--ink);stroke-linecap:round}
.sgn.cO{stroke:var(--cO)} .sgn.cA{stroke:var(--cA)} .sgn.cB{stroke:var(--cB)}
.card .exs button,.card .exs2 button{gap:6px}
.gtx{font:800 30px var(--font);fill:var(--ink)} .gtx.b{fill:var(--cB)}
</style>
</head>
<body>
<div class="wrap">
  <div class="dimmer" aria-hidden="true"></div>
  <a class="home" href="index.html" lang="sv">← Tillbaks till menyn</a>
  <header class="top">
    <div class="titles"><h1 lang="en">Wordless explanations</h1><p class="by" lang="en">by Niklas Jonsson Kaino</p></div>
    <div class="legend" aria-hidden="true">
      <svg class="lg" viewBox="0 0 330 30">
        <text class="tA" x="58" y="21" text-anchor="middle" style="font-size:17px">Förändring</text>
        <text class="t" x="130" y="21" text-anchor="middle" style="font-size:17px">=</text>
        <text class="t" x="180" y="21" text-anchor="middle" style="font-size:17px">Nytt</text>
        <text class="t" x="228" y="21" text-anchor="middle" style="font-size:17px">−</text>
        <text class="tB" x="282" y="21" text-anchor="middle" style="font-size:17px">Start</text>
      </svg>
    </div>
    <div class="dmbox"><span class="q" aria-hidden="true">?</span><div>
      <button data-dm="," aria-pressed="true">0,5</button><button data-dm="." aria-pressed="false">0.5</button></div></div>
  </header>

  <section class="sec" id="sec1">
    <div class="glyph" aria-hidden="true">
      <svg viewBox="0 0 80 72"><path class="gl" d="M40 3 L77 68 L3 68 Z"/><line class="gl" x1="23" y1="40" x2="57" y2="40"/>
        <text class="gt d" x="40" y="32" text-anchor="middle">F</text>
        <text class="gt a" x="22" y="62" text-anchor="middle">A</text><circle class="gd" cx="40" cy="57" r="2.4"/>
        <text class="gt h" x="58" y="62" text-anchor="middle">S</text></svg>
    </div>
    <div class="card">
      <svg class="stage" id="st1" viewBox="0 0 720 350" role="img" aria-label="Andel = Förändring / Start"><g class="meas" opacity="0"></g><g class="layer"></g></svg>
      <div class="bar">
        <div class="exs">
          <button data-k="andel" class="kO">Andel</button>
          <button data-k="forandring" class="kA" disabled>Förändring</button>
          <button data-k="start" class="kB" disabled>Start</button>
        </div>
        <div class="ctl" id="ctl1" hidden>
          <button class="pp replay" id="pp1" aria-label="pause" aria-pressed="false">❚❚</button>
          <button class="replay" id="rp1" aria-label="replay">↻</button>
          <button class="replay spd" aria-label="speed">1x</button>
          <button class="replay skip" aria-label="skip to end"><svg viewBox="0 0 22 16" aria-hidden="true"><path d="M1 1 L9 8 L1 15 Z M9 1 L17 8 L9 15 Z" fill="currentColor"/><rect x="18" y="1" width="3" height="14" rx="1" fill="currentColor"/></svg></button>
        </div>
      </div>
    </div>
  </section>

  <section class="sec" id="sec2">
    <div class="glyph" aria-hidden="true">
      <svg viewBox="0 0 120 60"><text x="22" y="40" text-anchor="middle" class="gtx b">15</text><path d="M44 33 H70 M63 26 L71 33 L63 40" class="gl"/><text x="96" y="40" text-anchor="middle" class="gtx">18</text></svg>
    </div>
    <div class="card">
      <svg class="stage" id="st2" viewBox="0 0 720 520" role="img" aria-label="Förändring"><g class="meas" opacity="0"></g><g class="layer"></g></svg>
      <div class="bar">
        <div class="meth">
          <button data-m="f" aria-label="fraction" aria-pressed="true"><span class="mf"><span>1</span><span>4</span></span></button>
          <button data-m="d" aria-label="decimal" aria-pressed="false"><span class="dlab">0,25</span></button>
        </div>
        <div class="exs2" id="exs2"></div>
        <div class="ctl" id="ctl2" hidden>
          <button class="pp replay" id="pp2" aria-label="pause" aria-pressed="false">❚❚</button>
          <button class="replay" id="rp2" aria-label="replay">↻</button>
          <button class="replay spd" aria-label="speed">1x</button>
          <button class="replay skip" aria-label="skip to end"><svg viewBox="0 0 22 16" aria-hidden="true"><path d="M1 1 L9 8 L1 15 Z M9 1 L17 8 L9 15 Z" fill="currentColor"/><rect x="18" y="1" width="3" height="14" rx="1" fill="currentColor"/></svg></button>
        </div>
      </div>
    </div>
  </section>

  <footer class="note" lang="en">
    <p>The dot (·) is used for multiplication instead of the cross (×), so it can't be confused with the variable x.</p>
    <p>The slash (/) is used for division instead of the obelus (÷), so it can't be confused with the plus sign (+).</p>
  </footer>
</div>

<script>
const RM=false;
const NS='http://www.w3.org/2000/svg';
let DM=',', METHOD='f';
try{DM=localStorage.getItem('adh-dm')||','; METHOD=localStorage.getItem('adh-m')||'f';}catch(e){}
// numbers are written with a comma in the code; shown with the chosen decimal mark
const fmt=s=>String(s).replace(/(\d),(\d)/g,'$1'+DM+'$2');

/* ---------- clock: one virtual time that stops while paused ---------- */
let clock=0, last=null, paused=false, SPEED=1;
const STAGES=[];
function tick(){
  for(const S of STAGES) for(const tw of S.tws.slice()){
    const p=Math.min(1,Math.max(0,(clock-tw.t0)/tw.d));
    tw.fn(tw.e(p));
    if(p>=1){const i=S.tws.indexOf(tw); if(i>=0) S.tws.splice(i,1); tw.res();}
  }
}
function frame(t){
  if(last!==null && !paused) clock+=Math.min(t-last,100)*SPEED;
  last=t; tick();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
const io=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const lin=p=>p;
const all=a=>Promise.all(a);

function mk(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function makeStage(id){
  const svg=document.getElementById(id);
  const S={svg,layer:svg.querySelector('.layer'),meas:svg.querySelector('.meas'),tws:[],mc:{}};
  S.tween=(d,fn,e=io)=>new Promise(res=>S.tws.push({t0:clock,d:Math.max(1,d),fn,e,res}));
  S.wait=d=>S.tween(d,()=>{},lin);
  S.measure=(s,fs=26)=>{
    const k=fs+'|'+s; if(S.mc[k]) return S.mc[k];
    const t=mk('text',{class:'w',style:'font-size:'+fs+'px'},S.meas); t.textContent=s;
    const w=t.getComputedTextLength(); t.remove();
    return (S.mc[k]=w||s.length*fs*.62);
  };
  STAGES.push(S); return S;
}

/* ---------- drawing objects ---------- */
class O{
  constructor(S){this.S=S;this.g=mk('g',{},S.layer);this.x=0;this.y=0;this.s=1;this.r=0;this.o=0;this.w=0;this.h=0;this.cls='';}
  ap(){
    this.g.setAttribute('transform',`translate(${this.x.toFixed(2)} ${this.y.toFixed(2)}) rotate(${this.r.toFixed(2)}) scale(${this.s.toFixed(3)})`);
    this.g.style.opacity=this.o;
    if(this.ln){this.ln.setAttribute('x1',(-this.w/2).toFixed(2));this.ln.setAttribute('x2',(this.w/2).toFixed(2));}
    return this;
  }
  kill(){this.g.remove();}
}
function word(S,str,cls,x,y,o=0,fs=26){
  const ob=new O(S); ob.kind='w'; ob.str=String(str); ob.cls=cls||''; ob.fs=fs;
  ob.t=mk('text',{'text-anchor':'middle',dy:'.35em',class:'w '+ob.cls,style:`font-size:${fs}px`,'data-rc':'w'},ob.g); ob.t.textContent=ob.str;
  ob.w=S.measure(ob.str,fs); ob.h=fs*1.15; ob.x=x; ob.y=y; ob.o=o; return ob.ap();
}
function hbar(S,w,x,y,o=0){
  const ob=new O(S); ob.kind='b'; ob.ln=mk('line',{class:'bl',y1:0,y2:0},ob.g);
  ob.w=w; ob.h=6; ob.x=x; ob.y=y; ob.o=o; return ob.ap();
}
// a small stacked fraction that moves as one piece
function fpic(S,a,b,cls,x,y,o=0,fs=24){
  const ob=new O(S); ob.kind='f'; ob.str=a+'/'+b; ob.cls=cls||''; ob.fs=fs;
  const bw=Math.max(S.measure(a,fs),S.measure(b,fs))+14;
  for(const [s,yy] of [[a,-.92*fs],[b,fs]]){const t=mk('text',{'text-anchor':'middle',dy:'.35em',y:yy,class:'w '+ob.cls,style:`font-size:${fs}px`,'data-rc':'w'},ob.g);t.textContent=s;}
  mk('line',{class:'bl fb',x1:-bw/2,x2:bw/2,y1:0,y2:0},ob.g);
  ob.w=bw; ob.h=2.3*fs; ob.x=x; ob.y=y; ob.o=o; return ob.ap();
}
function dots(S,n,cols,gap,r,x,y,o=0,cls=''){
  const ob=new O(S); ob.kind='d'; ob.str='dots'+n; ob.cls=cls; ob.cs=[];
  const rows=Math.ceil(n/cols);
  for(let i=0;i<n;i++){
    const cx=(i%cols-(cols-1)/2)*gap, cy=(Math.floor(i/cols)-(rows-1)/2)*gap;
    ob.cs.push(mk('circle',{cx,cy,r,class:'dt '+cls,'data-rc':'dt'},ob.g));
  }
  ob.w=(cols-1)*gap+2*r; ob.h=(rows-1)*gap+2*r; ob.x=x; ob.y=y; ob.o=o; return ob.ap();
}
function sector(cx,cy,R,a0,a1){
  const P=a=>[cx+R*Math.cos(a),cy+R*Math.sin(a)];
  const [x0,y0]=P(a0),[x1,y1]=P(a1);
  return `M${cx} ${cy}L${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 ${a1-a0>Math.PI?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z`;
}
function pieInto(g,k,n,R,cx,cls){
  mk('circle',{cx,cy:0,r:R,class:'pieb'},g);
  const A=i=>-Math.PI/2+i*2*Math.PI/n;
  for(let i=0;i<k;i++) mk('path',{d:sector(cx,0,R,A(i),A(i+1)),class:'pies '+cls,'data-rc':'pies'},g);
  for(let i=0;i<n;i++) mk('line',{x1:cx,y1:0,x2:cx+R*Math.cos(A(i)),y2:R*Math.sin(A(i)),class:'piel'},g);
  mk('circle',{cx,cy:0,r:R,class:'pieo'},g);
}
function pie(S,k,n,R,x,y,o=0,cls='cO'){
  const ob=new O(S); ob.kind='p'; ob.str='pie'+k+'/'+n; ob.cls=cls;
  pieInto(ob.g,k,n,R,0,cls); ob.w=ob.h=2*R; ob.x=x; ob.y=y; ob.o=o; return ob.ap();
}
// a circle with k of n parts shaded, and the fraction written next to it
function pieFr(S,k,n,x,y,o=0){
  const ob=new O(S); ob.kind='pf'; ob.str='pf'+k+'/'+n;
  pieInto(ob.g,k,n,30,-34,'');
  for(const [s,yy] of [[k,-22],[n,24]]){const t=mk('text',{'text-anchor':'middle',dy:'.35em',x:30,y:yy,class:'w',style:'font-size:24px','data-rc':'w'},ob.g);t.textContent=s;}
  mk('line',{class:'bl',x1:18,x2:42,y1:0,y2:0},ob.g);
  ob.w=124; ob.cx=-8; ob.h=64; ob.x=x; ob.y=y; ob.o=o; return ob.ap();
}
function calcObj(S,x,y){
  const ob=new O(S); ob.kind='c';
  mk('rect',{x:-75,y:-105,width:150,height:210,rx:16,class:'cbody'},ob.g);
  mk('rect',{x:-63,y:-92,width:126,height:60,rx:7,class:'cdisp'},ob.g);
  ob.ex=mk('text',{x:56,y:-70,'text-anchor':'end',class:'cexp'},ob.g);
  for(let r=0;r<4;r++)for(let c=0;c<4;c++) mk('rect',{x:-58+c*30,y:-18+r*29,width:25,height:23,rx:5,class:'ckey'},ob.g);
  ob.w=150; ob.h=210; ob.x=x; ob.y=y; ob.o=0; return ob.ap();
}
function clone(ob){
  const c=new O(ob.S); c.g.remove(); c.g=ob.g.cloneNode(true); ob.S.layer.appendChild(c.g);
  c.g.querySelectorAll('.hot').forEach(e=>e.classList.remove('hot'));
  for(const k of ['kind','str','cls','fs','w','h','x','y','s','cx']) c[k]=ob[k];
  c.r=0; c.o=0;
  if(ob.ln) c.ln=c.g.querySelector('line.bl');
  c.t=c.g.querySelector('text');
  return c.ap();
}
function recolor(ob,cls){

const W=(w,c,k,fs)=>({w:String(w),c:c||'',k,fs});

let AUTO=0;
function itemW(S,it,fs){
  if(it.num!=null) return numW(S,it.num,fs);
  if(it.sign) return SIGN[it.sign].w*fs/24;
  if(it.n) return Math.max(inW(S,it.n,fs),inW(S,it.d,fs))+16;
  if(it.fr) return Math.max(S.measure(it.fr[0],fs),S.measure(it.fr[1],fs))+14;
  if(it.pic) return it.pw;
  return Math.max(S.measure(fmt(it.w),it.fs||fs),it.mw?S.measure(it.mw,it.fs||fs):0);
}
function inW(S,l,fs){return l.reduce((a,t)=>a+itemW(S,t,fs),0)+6*(l.length-1);}
function placeIn(S,l,cx,y,fs,K){
  let x=cx-inW(S,l,fs)/2; const objs=[];
  l.forEach(t=>{const w=itemW(S,t,fs); objs.push(place(S,t,x+w/2,y,fs,K)); x+=w+6;});

}
function place(S,it,cx,y,fs,K){
  const k=it.k||('_'+(AUTO++)); let ob;

    const a=placeIn(S,it.n,cx,y-.92*fs,fs,K), b=placeIn(S,it.d,cx,y+fs,fs,K);

  else if(it.sign) ob=signObj(S,it.sign,cx,y,0,fs);

}

  let x=x0;
  items.forEach((it,i)=>{if(i) x+=it.tight?3:14; const w=itemW(S,it,fs); place(S,it,x+w/2,y,fs,K); x+=w;});

}
// the value as a calculator shows it

/* --- calculator --- */
async function calcStep(ctx,expr,res,dstKey,eqKey){
  const {S,K}=ctx;

  const C=ctx.C;
  if(ctx.CR){await anim(ctx.CR,{o:0},400); ctx.CR.kill(); ctx.CR=null;}
  C.ex.textContent='';
  const ring_=ring(C);
  await all([anim(ring_,{o:1},700),swell(C,1100)]);
  await S.wait(300);
  for(const ch of fmt(expr)){C.ex.textContent+=ch; await S.wait(ch===' '?80:220);}
  await S.wait(700);
  const k_=C.s, rs=fmt(res), w=S.measure(rs,17*k_);
  const r=word(S,rs,'',C.x+56*k_-w/2,C.y-48*k_,0,17*k_); ctx.CR=r;
  await anim(r,{o:1},700); await S.wait(600);
  await anim(ring_,{o:0},500); ring_.kill();
  await S.wait(400);
  if(eqKey) await anim(K[eqKey],{o:1},700);
  await fly(r,K[dstKey]);
  await S.wait(700);
}

// a copy of a/b glides to its place, then a and b trade places in arcs, one on each side of the bar
async function flip(src,grp){
  const S=src.S, fs=src.fs, [a,b]=src.str.split('/');
  const top=word(S,a,src.cls,src.x,src.y-.92*fs,0,fs), bot=word(S,b,src.cls,src.x,src.y+fs,0,fs), bar=hbar(S,src.w-14,src.x,src.y,0);
  const parts=[top,bot,bar];
  await all(parts.map(o=>anim(o,{o:1},450)));
  const tgt=grp[0], dx=tgt.x-src.x, dy=tgt.y-src.y;
  await all([...parts.map(o=>anim(o,{x:o.x+dx,y:o.y+dy},1200)),anim(bar,{w:tgt.w},1200)]);
  await S.wait(400);
  const cx=tgt.x, yt=top.y, yb=bot.y, R=Math.max(top.w,bot.w)/2+16;
  await S.tween(1500,p=>{
    const sx=R*Math.sin(Math.PI*p);
    top.x=cx+sx; top.y=yt+(yb-yt)*p; top.ap();
    bot.x=cx-sx; bot.y=yb-(yb-yt)*p; bot.ap();
  });
  grp.forEach(o=>{o.o=1;o.ap();});
  parts.forEach(o=>o.kill());
}



/* =====================================================================

   Purple = andel, orange = förändring, blue = start, green = highlighting and the step being done.
   ===================================================================== */
const UNITS={
  p:{sign:'%',base:100,hops:2,round:3},
  m:{sign:'‰',base:1000,hops:3,round:4},

const numVal=t=>parseFloat(String(t).replace('−','-').replace(',','.'));
// a value as it is written here: decimal comma and a true minus sign
const nf=v=>cs(v).replace('-','−');
const simpleDiv=b=>Math.abs(b)<10||/^10+$/.test(String(b));
const nl=g=>{g.nl=true; return g;};
// a minus sign or a bracket sits right next to what it belongs to
const TI=it=>Object.assign(it,{tight:true});
const rowW=(S,g)=>g.reduce((a,it,i)=>a+itemW(S,it,FS)+(i?(it.tight?3:14):0),0);

/* --- % and ‰ drawn as rings and a slash (the font has no ‰) --- */
const SIGN={'%':{w:18,rings:[[-5,-5.5],[5,5.5]],sl:[-6.5,9,6.5,-9]}, '‰':{w:27,rings:[[-9,-5.5],[1.5,5.5],[9.5,5.5]],sl:[-10.5,9,2.5,-9]}};
function signInto(g,sign,k){
  const G=SIGN[sign];
  G.rings.forEach(([x,y])=>mk('circle',{cx:x*k,cy:y*k,r:3.3*k,class:'sgn','data-rc':'sgn',style:`stroke-width:${2.3*k}px`},g));
  const [a,b,c,d]=G.sl; mk('line',{x1:a*k,y1:b*k,x2:c*k,y2:d*k,class:'sgn','data-rc':'sgn',style:`stroke-width:${2.3*k}px`},g);
}
function signObj(S,sign,x,y,o=0,fs=24){
  const ob=new O(S); ob.kind='sg'; ob.str=sign; ob.cls=''; ob.fs=fs;
  signInto(ob.g,sign,fs/24); ob.w=SIGN[sign].w*fs/24; ob.h=fs*.9; ob.x=x; ob.y=y; ob.o=o; return ob.ap();
}
function signSVG(sign,px){
  const G=SIGN[sign], k=px/24, W=(G.w+4)*k, H=24*k;
  let s=`<svg width="${W.toFixed(1)}" height="${H.toFixed(1)}" viewBox="${(-W/2).toFixed(1)} ${(-H/2).toFixed(1)} ${W.toFixed(1)} ${H.toFixed(1)}" aria-hidden="true" style="display:inline-block;vertical-align:middle">`;
  G.rings.forEach(([x,y])=>s+=`<circle cx="${x*k}" cy="${y*k}" r="${3.3*k}" fill="none" stroke="currentColor" stroke-width="${2.3*k}"/>`);
  const [a,b,c,d]=G.sl; s+=`<line x1="${a*k}" y1="${b*k}" x2="${c*k}" y2="${d*k}" stroke="currentColor" stroke-width="${2.3*k}" stroke-linecap="round"/>`;
  return s+'</svg>';
}

/* --- a number drawn one character per cell, spaced exactly like normal text, so its decimal mark can hop.
   A hop: the mark arcs over the next digit while that digit slides into the mark's place. --- */
const numCW=(S,fs)=>S.measure('0',fs);
function numW(S,str,fs){return String(str).length*numCW(S,fs);}
function numCell(ob,ch){const t=mk('text',{'text-anchor':'middle',dy:'.35em',class:'w '+ob.cls,style:`font-size:${ob.fs}px`,'data-rc':'w'},ob.g); t.textContent=ch===','?DM:ch; return {t,ch};}
function numLayout(ob){ob.cs.forEach((c,i)=>{c.t.setAttribute('x',(ob.left+(c.pos!=null?c.pos:i)*ob.cw).toFixed(2)); c.t.setAttribute('y',(c.lift||0).toFixed(2));});}
function numObj(S,str,cls,x,y,o=0,fs=24){
  const ob=new O(S); ob.kind='n'; ob.str='#'+str; ob.cls=cls||''; ob.fs=fs; ob.cw=numCW(S,fs);
  str=String(str); ob.cs=[...str].map(ch=>numCell(ob,ch));
  // a whole number has its mark hidden at the end
  if(!str.includes(',')){const c=numCell(ob,','); c.t.style.opacity=0; c.hid=true; ob.cs.push(c);}
  ob.left=-(str.length-1)*ob.cw/2; ob.w=str.length*ob.cw; ob.h=fs*1.15;
  numLayout(ob); ob.x=x; ob.y=y; ob.o=o; return ob.ap();
}
// a copy of a written number flies onto the cells of a hopping number, digit over digit, then becomes it
async function flyNum(src,num){
  const c=clone(src); await anim(c,{o:1},450);
  const vis=num.cs.filter(x=>!x.hid).length, props={x:num.x+num.left+(vis-1)/2*num.cw,y:num.y};
  if(src.fs&&num.fs) props.s=num.fs/src.fs;
  await anim(c,props,1200);
  await all([anim(c,{o:0},650),anim(num,{o:1},650)]); c.kill();
}
const markAt=ob=>ob.cs.findIndex(c=>c.ch===',');
// a zero is written in front: the digits slide right one place to make room, the zero fades in
async function frontZero(ob){const z=numCell(ob,'0'); z.t.style.opacity=0; ob.cs.unshift(z); const l0=ob.left-ob.cw; await ob.S.tween(700,p=>{ob.left=l0+ob.cw*p; z.t.style.opacity=p; numLayout(ob);}); ob.left=l0+ob.cw; numLayout(ob); return z;}
const fadeCell=(ob,c,show)=>ob.S.tween(600,p=>c.t.style.opacity=show?p:1-p);
async function swapHop(ob,dir){
  const S=ob.S; let i=markAt(ob), nd=null;
  // past the end there is no digit: a zero is drawn there as the mark passes
  if(dir>0 && i===ob.cs.length-1){nd=numCell(ob,'0'); nd.t.style.opacity=0; ob.cs.push(nd);}
  if(dir<0 && i===0){await frontZero(ob); i=1;}
  numLayout(ob);
  const j=i+dir, cm=ob.cs[i], dg=ob.cs[j];
  await S.tween(900,p=>{cm.pos=i+dir*p; cm.lift=-18*Math.sin(Math.PI*p); dg.pos=j-dir*p; if(nd) nd.t.style.opacity=p; numLayout(ob);});
  cm.pos=dg.pos=null; cm.lift=0; ob.cs[i]=dg; ob.cs[j]=cm; numLayout(ob);
}
// times 10 per hop: the mark moves right; a mark left at the end goes, zeros in front go and the number closes up
async function hop(ob,n){
  const S=ob.S;
  for(let i=0;i<n;i++){await swapHop(ob,1); await S.wait(400);}
  if(markAt(ob)===ob.cs.length-1){const c=ob.cs.pop(); await fadeCell(ob,c,false); c.t.remove();}
  while(ob.cs.length>1 && ob.cs[0].ch==='0' && ob.cs[1].ch!==','){
    const z=ob.cs[0]; await fadeCell(ob,z,false); z.t.remove(); ob.cs.shift(); ob.left+=ob.cw; numLayout(ob);
    const l0=ob.left; await S.tween(700,p=>{ob.left=l0-ob.cw*p; numLayout(ob);});
  }
}
// divided by 10 per hop: the mark (first shown at the end of a whole number) moves left, drawing zeros in front as it passes;
// a zero goes before a mark at the front, and zeros at the very end of the decimals fade
function leftZeros(k,n){let z=0; for(let i=0;i<n;i++){if(k===0){z++;k=1;} k--;} if(k===0) z++; return z;}
async function hopLeft(ob,n){
  const S=ob.S, m=ob.cs[markAt(ob)];
  if(m.hid){await fadeCell(ob,m,true); m.hid=false; await S.wait(500);}
  for(let i=0;i<n;i++){await swapHop(ob,-1); await S.wait(400);}
  if(markAt(ob)===0){await frontZero(ob); await S.wait(300);}
  while(ob.cs.length-1>markAt(ob) && ob.cs[ob.cs.length-1].ch==='0'){const z=ob.cs.pop(); await fadeCell(ob,z,false); z.t.remove();}
  if(markAt(ob)===ob.cs.length-1){const c=ob.cs.pop(); await fadeCell(ob,c,false); c.t.remove();}
}
function numText(ob){return ob.cs.filter(c=>!c.hid).map(c=>c.ch).join('');}
// a hopping number is written normally again once it has settled (same cells, so nothing moves)
async function settle(K,key){
  const ob=K[key], S=ob.S, t=fmt(numText(ob)), ww=S.measure(t,ob.fs), x0=ob.x+ob.left-ob.cw/2;
  const w=word(S,t,ob.cls,x0+ww/2,ob.y,0,ob.fs);
  await all([anim(ob,{o:0},400),anim(w,{o:1},400)]); ob.kill(); K[key]=w;
}

/* --- small helpers --- */
function box(objs){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;

  return {S:objs[0].S,x:(x0+x1)/2,y:(y0+y1)/2,w:x1-x0,h:y1-y0};
}
// faded copies float from where a thing is written to where it acts, and become it

async function flip2(src,dst){

async function runSteps(ctx,steps){
  const {S,K,G}=ctx;
  const ref=s=>s.startsWith('G:')?G[s.slice(2)]:K[s];
  const keys=l=>l.flatMap(k=>k.endsWith('*')?K[k]:[K[k]]);
  for(const [op,a,b,c,d] of steps){
    if(op==='show') await all(keys(a).map(o=>anim(o,{o:1},b||900)));
    else if(op==='fly') await fly(ref(a),K[b]);
    else if(op==='wait') await S.wait(a);
    else if(op==='wig') await all(keys(a).map(o=>swell(o,1300)));
    else if(op==='calc') await calcStep(ctx,a,b,c,d);
    else if(op==='hidecalc'){ if(ctx.C){await all([anim(ctx.C,{o:0},700),ctx.CR?anim(ctx.CR,{o:0},700):null]); ctx.C.kill(); if(ctx.CR) ctx.CR.kill(); ctx.C=ctx.CR=null;} }
    else if(op==='hop'){ await swell(K[c],1100); await hop(K[a],b); await settle(K,a);
      const w=K[a]; await anim(K[c],{x:w.x+w.w/2+12+K[c].w/2},800); }
    else if(op==='zeros'){
      // the zeros at the end of the denominator are ringed, and so are the zeros of 100 (1000) written under it
      const D=K[a], nz=String(b).length-1, cw=S.measure('0',D.fs);
      const ref=word(S,String(b),'cF',0,D.y+36,0,20); ref.x=D.x+D.w/2-ref.w/2; ref.ap();
      const cw2=S.measure('0',20);
      const zr=(ob,c,h)=>{const r=new O(S); mk('rect',{class:'ring',x:-nz*c-3,y:-h/2,width:nz*c+6,height:h,rx:7},r.g); r.x=ob.x+ob.w/2; r.y=ob.y; r.o=0; return r.ap();};
      const r1=zr(D,cw,D.fs*1.15);
      await all([anim(r1,{o:1},600),swell(D,1000)]);
      await anim(ref,{o:1},700);
      const r2=zr(ref,cw2,24); await anim(r2,{o:1},600);
      await S.wait(1800);
      await all([r1,r2,ref].map(o=>anim(o,{o:0},700))); [r1,r2,ref].forEach(o=>o.kill());
    }
    else if(op==='flyc'){ const r=await highlight(K.t); await fly(K.t,K.c0); await unhighlight(K.t,r); await anim(K.ce,{o:1},700); await S.wait(600); }
    else if(op==='flyh'){ const r=await highlight(K[c]); await fly(ref(a),K[b]); await unhighlight(K[c],r); }

    steps.push(['show',['u0','uL']],['fly','m1','u1'],['show',['u2']],['fly','m4','u3'],['wait',400],['fly','m2','u4'],['show',['u5']],['fly','m5','u6'],['wait',1000],
               ['show',['v0','vL']],['show',['v1']],['show',['v2']],['wait',1000]);
    divideTail(p,av,res,groups,steps);
  }else{
    groups.push(nl([E('d0'),W(fStr,'cA','d1'),SL('d2'),...(br?[W('(','','dob'),TI(W('−','','dm'))]:[]),br?TI(W(dec,'','dv')):W(dec,'','dv'),...(br?[TI(W(')','','dcb'))]:[]),E('d3'),W(res,'','q')]));
    steps.push(['show',['d0']],['fly','wd','d1'],['fly','w1','d2'],...(br?[['show',['dob']],['fly','wm','dm']]:[]),['dechop','wa','dv','ws',U.hops],...(br?[['show',['dcb']]]:[]),['wait',600],
               ['calc',`${fStr} / ${br?'(−'+dec+')':dec}`,res,'q','d3']);
  }
}

async function runEx(ex){
  const S=S2, U=UNITS[ex.u], t=ex.t, K={}, G={}, ctx={S,K,G,cx:640,cy:384,cs:.72};
  await clearLayer(S);
  // the small triangle
  const tri=mk('path',{class:'tri',d:'M588 104 L640 16 L692 104 Z'},S.layer); tri.style.opacity=0;
  const T={F:word(S,'F','cA',640,52,0,18), bar:hbar(S,46,640,69,0), A:word(S,'A','cO',614,89,0,18), dot:word(S,'·','',640,89,0,18), S:word(S,'S','cB',666,89,0,18)};
  // the task, word by word, wrapped
  const sp=S.measure('a',SFS), roles={}, SW=[]; let x=X0, y=30;
  ex.text.split(' ').forEach(tok=>{
    const m=tok.match(/^\{(\w+):([^}]+)\}(.*)$/), r=m?m[1]:null, s=m?m[2]:tok, tail=m?m[3]:'';
    const ws=r==='P'?SIGN[s].w*SFS/24:S.measure(fmt(s),SFS), wt=tail?S.measure(tail,SFS):0;
    if(x>X0 && x+ws+wt>560){x=X0; y+=46;}
    const ob=r==='P'?signObj(S,s,x+ws/2,y,0,SFS):word(S,fmt(s),'',x+ws/2,y,0,SFS);
    SW.push(ob); if(r) (roles[r]=roles[r]||[]).push(ob);
    x+=ws;
    if(tail){SW.push(word(S,tail,'',x+wt/2,y,0,SFS)); x+=wt;}
    x+=sp;
  });
  const num=l=>l&&l.find(o=>/\d/.test(o.str||''));
  Object.assign(G,{S:num(roles.S),N:num(roles.N),F:num(roles.F),A:num(roles.A),P:roles.P&&roles.P[0],MA:roles.MA&&roles.MA[0],MF:roles.MF&&roles.MF[0]});
  // the definition on its own row under the triangle
  const def=DEF[t](), dw=def.reduce((a,it)=>a+itemW(S,it,FS),0)+14*(def.length-1);
  buildRow(S,def,700-dw,190,FS,K);
  // first the change, when it is not given: new value − start
  const pre=ex.nw!=null, preSteps=[];
  if(pre){
    buildRow(S,[W('Förändring','cA','x0'),E('xe'),W(ex.nw,'','x1'),W('−','','xm'),W(ex.s,'cB','x2'),E('xe2'),W(nf(fVal(ex)),'cA','x3')],X0,Y0,FS,K);
    preSteps.push(['show',['x0','xe']],['fly','G:N','x1'],['show',['xm']],['fly','G:S','x2'],['wait',600],['show',['xe2']],['show',['x3']],['wig',['x3']],['wait',1000]);
  }
  // the working, in groups that wrap
  const groups=[], steps=[];
  ({andel:workAndel,forandring:workChange,start:workStart})[t](ex,U,groups,steps);
  if(ex.unit){ groups[groups.length-1].push(W(ex.unit,'','un')); steps.push(['show',['un']]); }
  steps.push(['wig',[t==='andel'?(METHOD==='f'?'pn':'gn'):'q']]);
  let row=pre?1:0, xr=X0, xeq=0;
  groups.forEach((g,gi)=>{
    const gw=rowW(S,g);
    if(gi>0){ if(g.nl||xr+14+gw>700){row++; xr=xeq;} else xr+=14; }
    xr=buildRow(S,g,xr,Y0+row*DY,FS,K);
    if(gi===0) xeq=K.ce.x-K.ce.w/2;
  });

  await all([S.tween(1000,p=>tri.style.opacity=p),...Object.values(T).map(o=>anim(o,{o:1},1000)),...SW.map(o=>anim(o,{o:1},1000))]);
  await S.wait(1400);
  // name what is given
  if(roles.S) await identBox(S,roles.S,'Start','cB');
  if(roles.N) await identBox(S,roles.N,'Nytt','');
  if(roles.MF) await identBox(S,roles.MF,'−','cA');
  if(roles.F) await identBox(S,roles.F,'Förändring','cA');
  if(roles.A) await identBox(S,[...roles.A,...roles.P],'Andel','cO');
  if(roles.MA) await identBox(S,roles.MA,'−','cO');
  if(pre){await runSteps(ctx,preSteps);}
  // the asked-for word starts the definition; a faded copy goes to its letter in the triangle, which fades
  const Q=roles.Q;
  let r=ring(box(Q)); await all([anim(r,{o:1},600),...Q.map(o=>swell(o,1100))]);
  await fly(Q[0],K.t); await anim(r,{o:0},500); r.kill(); await S.wait(700);
  const L=TLET[t], gh=clone(K.t);
  await anim(gh,{o:.45},500);
  await anim(gh,{x:T[L].x,y:T[L].y,s:.7},1300);
  await all([anim(gh,{o:0},900),...FADE2[t].map(f=>anim(T[f],{o:.2},1000))]); gh.kill();
  await S.wait(700);
  await anim(K.e1,{o:1},700); await S.wait(500);
  for(let j=0;j<3;j++){
    const src=T[USE2[t][j]];
    r=await highlight(src); await fly(src,K['p'+j]); await unhighlight(src,r); await S.wait(500);
  }
  await S.wait(900);
  await runSteps(ctx,steps);
  // the answer and the question belong together
  await S.wait(400);
  await all(Q.map(o=>swell(o,1300)));
}

/* =====================================================================
   running, pausing, spotlight
   ===================================================================== */
let RUN=0, running=false;
const pps=[1,2].map(n=>document.getElementById('pp'+n));
function setPaused(v){paused=v;pps.forEach(pp=>{pp.setAttribute('aria-pressed',v);pp.textContent=v?'▶':'❚❚';pp.setAttribute('aria-label',v?'play':'pause');});}
let liftTimer=null;
function focusOn(sec,on){
  clearTimeout(liftTimer);
  if(on){
    document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('active',s===sec));
    document.body.classList.add('focusing');
  }else{
    // the card keeps its place above the dimmer until the dimmer has faded away
    document.body.classList.remove('focusing');
    liftTimer=setTimeout(()=>sec.classList.remove('active'),2200);
  }
}
async function go(n,job){
  const id=++RUN; STAGES.forEach(S=>S.tws=[]); running=true;
  setPaused(false);
  const sec=document.getElementById('sec'+n);
  document.getElementById('ctl'+n).hidden=false;
  focusOn(sec,true);
  await document.fonts.ready;
  if(id!==RUN) return false;
  await job();
  if(id!==RUN) return false;
  running=false;
  setTimeout(()=>{if(id===RUN&&!running) focusOn(sec,false);},1300);
  return true;
}
// part 1
const btns1=[...document.querySelectorAll('#sec1 .exs button')]; let last1=null;
async function start1(k){
  last1=k;
  btns1.forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  const done=await go(1,async()=>{
    if(k==='andel') await buildFromDefinition(); else await resetBase();
    await solve1(k);
  });
  if(done && k==='andel') btns1.forEach(b=>b.disabled=false);
}
btns1.forEach(b=>b.addEventListener('click',()=>{if(!b.disabled) start1(b.dataset.k);}));
document.getElementById('rp1').addEventListener('click',()=>{if(last1) start1(last1);});
// part 2: three rows, each marked with the triangle letter it finds
let last2=null;
function rowIcon(t){
  const c=l=>TLET[t]===l?({A:'a',F:'d',S:'h'})[l]:'m';
  return `<svg class="ric" viewBox="0 0 80 72" aria-hidden="true"><path class="gl" d="M40 3 L77 68 L3 68 Z"/><line class="gl" x1="23" y1="40" x2="57" y2="40"/>
    <text class="gt ${c('F')}" x="40" y="32" text-anchor="middle">F</text><text class="gt ${c('A')}" x="22" y="62" text-anchor="middle">A</text>
    <circle class="gd" cx="40" cy="57" r="2.4"/><text class="gt ${c('S')}" x="58" y="62" text-anchor="middle">S</text></svg>`;
}
function btnHTML(ex){
  const sg=signSVG(ex.u==='p'?'%':'‰',14), A=`<span class="kO">${ex.na?'−':''}${fmt(ex.a||'')}</span>${sg}`;
  if(ex.t==='andel') return ex.nw!=null?`<span class="kB">${ex.s}</span><span>→</span><span>${ex.nw}</span>`:`<span class="kB">${ex.s}</span><span class="kA">+${ex.f}</span>`;
  if(ex.t==='forandring') return `${A}<span>·</span><span class="kB">${ex.s}</span>`;
  return `<span class="kA">${ex.nf?'−':''}${ex.f}</span><span>=</span>${A}`;
}
function drawButtons(){
  const box_=document.getElementById('exs2'); box_.innerHTML='';
  ['andel','forandring','start'].forEach(t=>{
    const row=document.createElement('div'); row.className='erow'; row.innerHTML=rowIcon(t);
    EX.forEach((ex,i)=>{
      if(ex.t!==t) return;
      const b=document.createElement('button'); b.dataset.i=i; b.innerHTML=btnHTML(ex); if(i===last2) b.classList.add('on');
      b.addEventListener('click',()=>start2(i)); row.appendChild(b);
    });
    box_.appendChild(row);
  });
}
function start2(i){
  last2=i;
  document.querySelectorAll('#exs2 button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
  go(2,()=>runEx(EX[i]));
}
document.getElementById('rp2').addEventListener('click',()=>{if(last2!==null) start2(last2);});
const mbtns=[...document.querySelectorAll('#sec2 .meth button')];
function setMethod(m){
  METHOD=m; try{localStorage.setItem('adh-m',m);}catch(e){}
  mbtns.forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));
}
mbtns.forEach(b=>b.addEventListener('click',()=>{setMethod(b.dataset.m); if(last2!==null) start2(last2);}));
setMethod(METHOD);
// decimal mark
const dmb=[...document.querySelectorAll('.dmbox button')];
function setDM(m){
  DM=m; try{localStorage.setItem('adh-dm',m);}catch(e){}
  dmb.forEach(b=>b.setAttribute('aria-pressed',b.dataset.dm===m));
  drawButtons();
  document.querySelector('#sec2 .dlab').textContent=fmt('0,25');
}
dmb.forEach(b=>b.addEventListener('click',()=>setDM(b.dataset.dm)));
setDM(DM);

pps.forEach(pp=>pp.addEventListener('click',()=>{if(running) setPaused(!paused);}));
// speed: 0,5x → 1x → 1,5x → 2x → 4x → 0,5x
const SPEEDS=[.5,1,1.5,2,4], spds=[...document.querySelectorAll('.spd')];
try{const v=+localStorage.getItem('adh-sp'); if(SPEEDS.includes(v)) SPEED=v;}catch(e){}
function showSpeed(){document.querySelectorAll('.spd').forEach(b=>{b.textContent=fmt(String(SPEED).replace('.',','))+'x'; b.setAttribute('aria-label','speed '+SPEED);});}
spds.forEach(b=>b.addEventListener('click',()=>{
  SPEED=SPEEDS[(SPEEDS.indexOf(SPEED)+1)%SPEEDS.length]; try{localStorage.setItem('adh-sp',SPEED);}catch(e){}
  showSpeed();
}));
// skip to end: the clock jumps from one finished movement to the next until the example is done
const chan=new MessageChannel(), yieldNow=()=>new Promise(r=>{chan.port1.onmessage=()=>r(); chan.port2.postMessage(0);});
let skipping=false;
async function skipToEnd(){
  if(!running || skipping) return;
  const id=RUN; skipping=true; setPaused(false);
  for(let guard=0; running && id===RUN && guard<200000; guard++){
    let t=Infinity; for(const S of STAGES) for(const tw of S.tws) t=Math.min(t,tw.t0+tw.d);
    if(t<Infinity){clock=Math.max(clock,t); tick();}
    await yieldNow();
  }
  skipping=false;
}
document.querySelectorAll('.skip').forEach(b=>b.addEventListener('click',skipToEnd));
showSpeed();
document.querySelectorAll('.dmbox button').forEach(b=>b.addEventListener('click',()=>showSpeed()));
document.addEventListener('keydown',e=>{
  if(e.code==='Space' && running && !(e.target instanceof HTMLButtonElement)){e.preventDefault();setPaused(!paused);}
});
</script>
