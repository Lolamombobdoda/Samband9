<html lang="sv">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;600;800&display=swap">
<style>
/* Stage 1: the definition and the triangle. Stage 2: examples worked with a small triangle.
   Purple = andel, orange = del, blue = hel, green = highlighting and the step being done. */
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#172031; --mute:#7D879A; --rule:#D3D9E2; --dim:rgba(16,22,34,.16);
  --cA:#DD5F0B; --cB:#2357D4; --cF:#0E8A5A; --cO:#7A3FD8;
  --font:'Azeret Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1015; --panel:#161A21; --ink:#E6E9EF; --mute:#77839A; --rule:#2B323E; --dim:rgba(0,0,0,.45);
  --cA:#FF8A42; --cB:#6E97FF; --cF:#34C98A; --cO:#B08CFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1015; --panel:#161A21; --ink:#E6E9EF; --mute:#77839A; --rule:#2B323E; --dim:rgba(0,0,0,.45);
  --cA:#FF8A42; --cB:#6E97FF; --cF:#34C98A; --cO:#B08CFF; color-scheme:dark}

body{margin:0;font-size:14px;background:var(--bg);color:var(--ink);font-family:var(--font)}
[hidden]{display:none!important}
.wrap{max-width:936px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:36px 72px;display:flex;flex-direction:column;gap:44px}
.top{display:flex;flex-direction:column;align-items:center;gap:18px}
.titles{text-align:center}
.titles h1{font:800 clamp(28px,5.5vw,46px)/1.1 var(--font);margin:0;letter-spacing:-.01em;text-wrap:balance}
.titles .by{margin:8px 0 0;font-size:15px;color:var(--mute);letter-spacing:.02em}
.dimmer{position:fixed;inset:0;background:var(--dim);opacity:0;pointer-events:none;transition:opacity 2s;z-index:1}
body.focusing .dimmer{opacity:1}
.top,.sec,.note{position:relative;transition:opacity 2s}
body.focusing .dimmer,body.focusing .top,body.focusing .sec,body.focusing .note{transition-duration:.9s}
body.focusing .top,body.focusing .sec:not(.active),body.focusing .note{opacity:.4}
.sec.active{z-index:2}
.ops{font-size:clamp(48px,11vw,96px);font-weight:800;letter-spacing:.12em;line-height:1}
.legend{display:flex;justify-content:center}
.legend svg{width:min(380px,100%);height:auto}
.dmbox{display:flex;flex-direction:column;align-items:center;gap:6px}
.dmbox .q{font:800 18px/1 var(--font);color:var(--mute)}
.dmbox div{display:flex;gap:8px}
.dmbox button{font:600 15px/1 var(--font);padding:7px 11px;border-radius:12px;border:1.5px solid var(--rule);background:var(--panel);color:var(--ink);cursor:pointer}
.dmbox button[aria-pressed="true"]{border:2px solid var(--ink)}
.sec{display:grid;grid-template-columns:152px minmax(0,1fr);gap:16px;align-items:start}
.glyph{display:flex;justify-content:center;padding-top:10px}
.glyph svg{width:80px;height:72px}
@media (max-width:640px){.sec{grid-template-columns:minmax(0,1fr)}.glyph{justify-content:flex-start;padding-top:0}.glyph svg{width:56px;height:50px}}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:16px;overflow:hidden;min-width:0}
svg.stage{display:block;width:100%;height:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-top:1px solid var(--rule);align-items:center}
.exs{display:flex;flex-wrap:wrap;gap:8px;flex:1;min-width:0}
.card button{font:600 17px/1 var(--font);padding:9px 16px;border-radius:14px;border:1.5px solid var(--rule);background:var(--panel);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:opacity .6s,filter .6s,border-color .3s}
.card button:hover:not(:disabled){border-color:var(--mute)}
.card button.on{border:2px solid var(--ink)}
.card button:disabled{opacity:.3;filter:grayscale(1);cursor:not-allowed}
.bar .replay{font-size:22px;padding:8px 14px;align-self:stretch;min-width:52px}
.bar .pp[aria-pressed="true"]{border:2px solid var(--cF);color:var(--cF)}
button:focus-visible{outline:3px solid var(--cB);outline-offset:2px}
.kA{color:var(--cA)} .kB{color:var(--cB)} .kO{color:var(--cO)}
/* stage 2 buttons */
.meth{display:flex;flex-direction:column;gap:8px;padding-right:12px;margin-right:4px;border-right:1px solid var(--rule);align-self:stretch;justify-content:center}
.meth button{padding:7px 12px;min-width:64px}
.meth button[aria-pressed="true"]{border:2px solid var(--ink)}
.exs2{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.erow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.erow .ric{width:34px;height:30px;flex:none}
.card .exs2 button{font-size:15px;padding:7px 12px;min-height:44px}
.card button svg{display:block}
.mf{display:inline-flex;flex-direction:column;align-items:center;line-height:1;font-size:.85em}
.mf>span:first-child{border-bottom:1.5px solid currentColor;padding:0 2px 2px}
.mf>span:last-child{padding:2px 2px 0}

svg text{font-family:var(--font);font-weight:600}
.w{fill:var(--ink);font-size:26px;transition:fill .5s}
.w.cA{fill:var(--cA)} .w.cB{fill:var(--cB)} .w.cO{fill:var(--cO)} .w.cF{fill:var(--cF)} .w.hot{fill:var(--cF)}
.bl{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;transition:stroke .5s,stroke-width .5s}
.bl.hot{stroke:var(--cF);stroke-width:5}
.tri{fill:none;stroke:var(--mute);stroke-width:2;stroke-linejoin:round}
.ring{fill:none;stroke:var(--cF);stroke-width:2.5}
.whole{fill:none;stroke:var(--cB);stroke-width:2.5}
.dt{fill:var(--ink);transition:fill .6s}
.dt.cA{fill:var(--cA)} .dt.cB{fill:var(--cB)} .dt.cO{fill:var(--cO)}
.pieb{fill:var(--panel)}
.pies{fill:var(--mute);fill-opacity:.45;transition:fill .6s,fill-opacity .6s}
.pies.cO{fill:var(--cO);fill-opacity:.85}
.piel{stroke:var(--ink);stroke-width:1;stroke-opacity:.5}
.pieo{fill:none;stroke:var(--ink);stroke-width:1.6}
.cbody{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}
.cdisp{fill:var(--panel);stroke:var(--rule);stroke-width:1.5}
.ckey{fill:var(--panel);stroke:var(--rule);stroke-width:1.2}
.cexp{fill:var(--mute);font-size:13px}
.lg text{font-size:15px}
.lg .t{fill:var(--ink)} .lg .tA{fill:var(--cA)} .lg .tB{fill:var(--cB)} .lg .tO{fill:var(--cO)}
.lg .cell{fill:var(--cA);fill-opacity:.85}
.lg .out{fill:none;stroke:var(--ink);stroke-width:1.5}
.lg .cut{stroke:var(--mute);stroke-width:1}
.lg .brA{fill:none;stroke:var(--cA);stroke-width:1.5}
.lg .brB{fill:none;stroke:var(--cB);stroke-width:1.5}
.lg .fb{stroke:var(--ink);stroke-width:1.5}
.gl{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.gt{font-family:var(--font);font-weight:800;font-size:15px}
.gt.a{fill:var(--cO)} .gt.d{fill:var(--cA)} .gt.h{fill:var(--cB)} .gt.m{fill:var(--mute)}
.gd{fill:var(--ink)} .gd.a{fill:var(--cA)}
.home{align-self:flex-start;margin-bottom:-24px;font:600 14px/1 var(--font);padding:9px 14px;border-radius:14px;border:1.5px solid var(--rule);background:var(--panel);color:var(--ink);text-decoration:none;position:relative;transition:opacity 2s,border-color .3s}
.home:hover{border-color:var(--mute)}
.home:focus-visible{outline:3px solid var(--cB);outline-offset:2px}
body.focusing .home{opacity:.4;transition-duration:.9s}
.note{max-width:62ch;margin:0 auto;text-align:center;font-size:13px;line-height:1.6;color:var(--mute)}
.note p{margin:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="dimmer" aria-hidden="true"></div>
  <a class="home" href="index.html" lang="sv">← Tillbaks till menyn</a>
  <header class="top">
    <div class="titles"><h1 lang="en">Wordless explanations</h1><p class="by" lang="en">by Niklas Jonsson Kaino</p></div>
    <div class="legend" aria-hidden="true">
      <svg class="lg" viewBox="0 0 380 96">
        <!-- a bar of 5 pieces, 2 shaded: del over the shaded part, hel under the whole bar -->
        <text class="tA" x="50" y="13" text-anchor="middle">Del</text>
        <path class="brA" d="M10 30 Q10 24 16 24 L44 24 Q50 24 50 18 Q50 24 56 24 L84 24 Q90 24 90 30"/>
        <rect class="cell" x="10" y="34" width="80" height="26"/>
        <line class="cut" x1="50" y1="34" x2="50" y2="60"/><line class="cut" x1="90" y1="34" x2="90" y2="60"/>
        <line class="cut" x1="130" y1="34" x2="130" y2="60"/><line class="cut" x1="170" y1="34" x2="170" y2="60"/>
        <rect class="out" x="10" y="34" width="200" height="26"/>
        <path class="brB" d="M10 64 Q10 70 16 70 L104 70 Q110 70 110 76 Q110 70 116 70 L204 70 Q210 70 210 64"/>
        <text class="tB" x="110" y="92" text-anchor="middle">Hel</text>
        <text class="tO" x="270" y="53" text-anchor="middle">Andel</text>
        <text class="t" x="314" y="53" text-anchor="middle">=</text>
        <text class="tA" x="344" y="38" text-anchor="middle">2</text>
        <line class="fb" x1="334" y1="48" x2="354" y2="48"/>
        <text class="tB" x="344" y="67" text-anchor="middle">5</text>
      </svg>
    </div>
    <div class="dmbox"><span class="q" aria-hidden="true">?</span><div>
      <button data-dm="," aria-pressed="true">0,5</button><button data-dm="." aria-pressed="false">0.5</button></div></div>
  </header>

  <section class="sec" id="sec1">
    <div class="glyph" aria-hidden="true">
      <svg viewBox="0 0 80 72"><path class="gl" d="M40 3 L77 68 L3 68 Z"/><line class="gl" x1="23" y1="40" x2="57" y2="40"/>
        <text class="gt d" x="40" y="32" text-anchor="middle">D</text>
        <text class="gt a" x="22" y="62" text-anchor="middle">A</text><circle class="gd" cx="40" cy="57" r="2.4"/>
        <text class="gt h" x="58" y="62" text-anchor="middle">H</text></svg>
    </div>
    <div class="card">
      <svg class="stage" id="st1" viewBox="0 0 720 350" role="img" aria-label="Andel = Del / Hel">
        <g class="meas" opacity="0"></g>
        <g class="layer"></g>
      </svg>
      <div class="bar">
        <div class="exs">
          <button data-k="andel" class="kO">Andel</button>
          <button data-k="del" class="kA" disabled>Del</button>
          <button data-k="hel" class="kB" disabled>Hel</button>
        </div>
        <button class="pp replay" id="pp1" aria-label="pause" aria-pressed="false" hidden>❚❚</button>

  <section class="sec" id="sec2">
    <div class="glyph" aria-hidden="true">
      <svg viewBox="0 0 80 72">
        <circle class="gd" cx="16" cy="26" r="6"/><circle class="gd" cx="32" cy="26" r="6"/><circle class="gd" cx="48" cy="26" r="6"/><circle class="gd" cx="64" cy="26" r="6"/>
        <circle class="gd" cx="16" cy="44" r="6"/><circle class="gd" cx="32" cy="44" r="6"/><circle class="gd" cx="48" cy="44" r="6"/><circle class="gd" cx="64" cy="44" r="6"/>
        <circle class="gd a" cx="16" cy="26" r="6"/><circle class="gd a" cx="32" cy="26" r="6"/></svg>
    </div>
    <div class="card">
      <svg class="stage" id="st2" viewBox="0 0 720 450" role="img" aria-label="Andel, del, hel">
        <g class="meas" opacity="0"></g>
        <g class="layer"></g>
      </svg>
      <div class="bar">
        <div class="meth">
          <button data-m="f" aria-label="fraction" aria-pressed="true"><span class="mf"><span>1</span><span>4</span></span></button>
          <button data-m="d" aria-label="decimal" aria-pressed="false"><span class="dlab">0,25</span></button>
        </div>
        <div class="exs2" id="exs2"></div>
        <button class="pp replay" id="pp2" aria-label="pause" aria-pressed="false" hidden>❚❚</button>
        <button class="replay" id="rp2" aria-label="replay" hidden>↻</button>
      </div>
    </div>
  </section>

  <footer class="note" lang="en">
    <p>The dot (·) is used for multiplication instead of the cross (×), so it can't be confused with the variable x.</p>
    <p>The slash (/) is used for division instead of the obelus (÷), so it can't be confused with the plus sign (+).</p>
  </footer>

<script>
const RM=false;
const NS='http://www.w3.org/2000/svg';
let DM=',', METHOD='f';
try{DM=localStorage.getItem('adh-dm')||','; METHOD=localStorage.getItem('adh-m')||'f';}catch(e){}
// numbers are written with a comma in the code; shown with the chosen decimal mark
const fmt=s=>String(s).replace(/(\d),(\d)/g,'$1'+DM+'$2');

/* ---------- clock: one virtual time that stops while paused ---------- */
let clock=0, last=null, paused=false;
const STAGES=[];
function frame(t){
  if(last!==null && !paused) clock+=Math.min(t-last,100);
  last=t;
  for(const S of STAGES) for(const tw of S.tws.slice()){
    const p=Math.min(1,Math.max(0,(clock-tw.t0)/tw.d));
    tw.fn(tw.e(p));
    if(p>=1){const i=S.tws.indexOf(tw); if(i>=0) S.tws.splice(i,1); tw.res();}
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
const io=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const lin=p=>p;
const all=a=>Promise.all(a);

function mk(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function makeStage(id){
  const svg=document.getElementById(id);
  const S={svg,layer:svg.querySelector('.layer'),meas:svg.querySelector('.meas'),tws:[],mc:{}};
  S.tween=(d,fn,e=io)=>new Promise(res=>S.tws.push({t0:clock,d:Math.max(1,d),fn,e,res}));
  S.wait=d=>S.tween(d,()=>{},lin);
  S.measure=(s,fs=26)=>{
    const k=fs+'|'+s; if(S.mc[k]) return S.mc[k];
    const t=mk('text',{class:'w',style:'font-size:'+fs+'px'},S.meas); t.textContent=s;
    const w=t.getComputedTextLength(); t.remove();
    return (S.mc[k]=w||s.length*fs*.62);
  };
  STAGES.push(S); return S;
}

/* ---------- drawing objects ---------- */
class O{
  constructor(S){this.S=S;this.g=mk('g',{},S.layer);this.x=0;this.y=0;this.s=1;this.r=0;this.o=0;this.w=0;this.h=0;this.cls='';}
  ap(){
    this.g.setAttribute('transform',`translate(${this.x.toFixed(2)} ${this.y.toFixed(2)}) rotate(${this.r.toFixed(2)}) scale(${this.s.toFixed(3)})`);
    this.g.style.opacity=this.o;
    if(this.ln){this.ln.setAttribute('x1',(-this.w/2).toFixed(2));this.ln.setAttribute('x2',(this.w/2).toFixed(2));}
    return this;
  }
  kill(){this.g.remove();}
}
function word(S,str,cls,x,y,o=0,fs=26){
  const ob=new O(S); ob.kind='w'; ob.str=String(str); ob.cls=cls||''; ob.fs=fs;
  ob.t=mk('text',{'text-anchor':'middle',dy:'.35em',class:'w '+ob.cls,style:`font-size:${fs}px`,'data-rc':'w'},ob.g); ob.t.textContent=ob.str;
  ob.w=S.measure(ob.str,fs); ob.h=fs*1.15; ob.x=x; ob.y=y; ob.o=o; return ob.ap();
}
function hbar(S,w,x,y,o=0){
  const ob=new O(S); ob.kind='b'; ob.ln=mk('line',{class:'bl',y1:0,y2:0},ob.g);
  ob.w=w; ob.h=6; ob.x=x; ob.y=y; ob.o=o; return ob.ap();
}
// a small stacked fraction that moves as one piece
function fpic(S,a,b,cls,x,y,o=0,fs=24){
  const ob=new O(S); ob.kind='f'; ob.str=a+'/'+b; ob.cls=cls||''; ob.fs=fs;
  const bw=Math.max(S.measure(a,fs),S.measure(b,fs))+14;
  for(const [s,yy] of [[a,-.92*fs],[b,fs]]){const t=mk('text',{'text-anchor':'middle',dy:'.35em',y:yy,class:'w '+ob.cls,style:`font-size:${fs}px`,'data-rc':'w'},ob.g);t.textContent=s;}
  mk('line',{class:'bl fb',x1:-bw/2,x2:bw/2,y1:0,y2:0},ob.g);
  ob.w=bw; ob.h=2.3*fs; ob.x=x; ob.y=y; ob.o=o; return ob.ap();
}
function dots(S,n,cols,gap,r,x,y,o=0,cls=''){
  const ob=new O(S); ob.kind='d'; ob.str='dots'+n; ob.cls=cls; ob.cs=[];
  const rows=Math.ceil(n/cols);
  for(let i=0;i<n;i++){
    const cx=(i%cols-(cols-1)/2)*gap, cy=(Math.floor(i/cols)-(rows-1)/2)*gap;
    ob.cs.push(mk('circle',{cx,cy,r,class:'dt '+cls,'data-rc':'dt'},ob.g));
  }
  ob.w=(cols-1)*gap+2*r; ob.h=(rows-1)*gap+2*r; ob.x=x; ob.y=y; ob.o=o; return ob.ap();
}
function sector(cx,cy,R,a0,a1){
  const P=a=>[cx+R*Math.cos(a),cy+R*Math.sin(a)];
  const [x0,y0]=P(a0),[x1,y1]=P(a1);
  return `M${cx} ${cy}L${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 ${a1-a0>Math.PI?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z`;
}
function pieInto(g,k,n,R,cx,cls){
  mk('circle',{cx,cy:0,r:R,class:'pieb'},g);
  const A=i=>-Math.PI/2+i*2*Math.PI/n;
  for(let i=0;i<k;i++) mk('path',{d:sector(cx,0,R,A(i),A(i+1)),class:'pies '+cls,'data-rc':'pies'},g);
  for(let i=0;i<n;i++) mk('line',{x1:cx,y1:0,x2:cx+R*Math.cos(A(i)),y2:R*Math.sin(A(i)),class:'piel'},g);
  mk('circle',{cx,cy:0,r:R,class:'pieo'},g);
}
function pie(S,k,n,R,x,y,o=0,cls='cO'){
  const ob=new O(S); ob.kind='p'; ob.str='pie'+k+'/'+n; ob.cls=cls;
  pieInto(ob.g,k,n,R,0,cls); ob.w=ob.h=2*R; ob.x=x; ob.y=y; ob.o=o; return ob.ap();
}
// a circle with k of n parts shaded, and the fraction written next to it
function pieFr(S,k,n,x,y,o=0){
  const ob=new O(S); ob.kind='pf'; ob.str='pf'+k+'/'+n;
  pieInto(ob.g,k,n,30,-34,'');
  for(const [s,yy] of [[k,-22],[n,24]]){const t=mk('text',{'text-anchor':'middle',dy:'.35em',x:30,y:yy,class:'w',style:'font-size:24px','data-rc':'w'},ob.g);t.textContent=s;}
  mk('line',{class:'bl',x1:18,x2:42,y1:0,y2:0},ob.g);
  ob.w=124; ob.cx=-8; ob.h=64; ob.x=x; ob.y=y; ob.o=o; return ob.ap();
}
function calcObj(S,x,y){
  const ob=new O(S); ob.kind='c';
  mk('rect',{x:-75,y:-105,width:150,height:210,rx:16,class:'cbody'},ob.g);
  mk('rect',{x:-63,y:-92,width:126,height:60,rx:7,class:'cdisp'},ob.g);
  ob.ex=mk('text',{x:56,y:-70,'text-anchor':'end',class:'cexp'},ob.g);
  for(let r=0;r<4;r++)for(let c=0;c<4;c++) mk('rect',{x:-58+c*30,y:-18+r*29,width:25,height:23,rx:5,class:'ckey'},ob.g);
  ob.w=150; ob.h=210; ob.x=x; ob.y=y; ob.o=0; return ob.ap();
}
function clone(ob){
  const c=new O(ob.S); c.g.remove(); c.g=ob.g.cloneNode(true); ob.S.layer.appendChild(c.g);
  c.g.querySelectorAll('.hot').forEach(e=>e.classList.remove('hot'));
  for(const k of ['kind','str','cls','fs','w','h','x','y','s','cx']) c[k]=ob[k];
  c.r=0; c.o=0;
  if(ob.ln) c.ln=c.g.querySelector('line.bl');
  c.t=c.g.querySelector('text');
  return c.ap();
}
function recolor(ob,cls){
  ob.g.querySelectorAll('[data-rc]').forEach(e=>e.setAttribute('class',e.dataset.rc+(cls?' '+cls:'')));
  ob.cls=cls;
}
function anim(ob,props,d=1200,e=io){
  const from={}; for(const k in props) from[k]=ob[k];
  return ob.S.tween(d,p=>{for(const k in props) ob[k]=from[k]+(props[k]-from[k])*p; ob.ap();},e);
}
// a gentle swell and a small tilt, then back
function swell(ob,d=1100){
  const s0=ob.s;
  return ob.S.tween(d,p=>{const b=Math.sin(Math.PI*p);ob.s=s0*(1+.12*b);ob.r=4*Math.sin(4*Math.PI*p)*b;ob.ap();},lin).then(()=>{ob.s=s0;ob.r=0;ob.ap();});
}
function hot(ob,on){(ob.ln||ob.t).classList.toggle('hot',on);}
function ring(ob){
  const r=new O(ob.S); r.kind='r';
  mk('rect',{class:'ring',x:-(ob.w/2+12)+(ob.cx||0),y:-(ob.h/2+8),width:ob.w+24,height:ob.h+16,rx:14},r.g);
  r.x=ob.x; r.y=ob.y; r.o=0; return r.ap();
}
async function highlight(ob){
  if(ob.kind==='b'||ob.str==='·'){hot(ob,true); await all([swell(ob,1000),ob.S.wait(1000)]); return null;}
  const r=ring(ob); await all([anim(r,{o:1},600),swell(ob,1100)]); return r;
}
async function unhighlight(ob,r){
  if(r){await anim(r,{o:0},500); r.kill();} else {hot(ob,false); await ob.S.wait(500);}
}
// a copy grows out of its original and glides to its place; if the place shows something else, the copy turns into it
async function fly(src,dst){
  const group=Array.isArray(dst), tgt=group?dst[0]:dst;
  const c=clone(src); await anim(c,{o:1},450);
  const same=!group && 'wbf'.includes(src.kind) && src.kind===tgt.kind && src.str===tgt.str && src.cls===tgt.cls;
  const props={x:tgt.x,y:tgt.y};
  if(same && src.fs && tgt.fs) props.s=tgt.fs/src.fs;
  if(same && src.kind==='b') props.w=tgt.w;
  await anim(c,props,1200);
  if(same){tgt.o=1;tgt.ap();c.kill();}
  else{await all([anim(c,{o:0},650),...(group?dst:[dst]).map(o=>anim(o,{o:1},650))]); c.kill();}
}
async function clearLayer(S){
  const kids=[...S.layer.children];
  if(kids.length) await S.tween(600,p=>kids.forEach(k=>k.style.opacity=Math.min(+(k.style.opacity||1),1-p)));
  S.layer.innerHTML='';
}

const S1=makeStage('st1');
const X1=40, Y11=120, Y12=245;
function layout1(items,y){
  let x=X1; const out=[];
  items.forEach((it,i)=>{
    if(i) x+=16;
    if(it.n){
      const bw=Math.max(S1.measure(it.n.w),S1.measure(it.d.w))+18;
      out.push({frac:true,n:{x:x+bw/2,y:y-24},bar:{x:x+bw/2,y,w:bw},d:{x:x+bw/2,y:y+26}});
      x+=bw;
    }else{const w=S1.measure(it.w); out.push({x:x+w/2,y}); x+=w;}
  });
  return out;
}
const TA={x:530,y:34}, TL={x:370,y:311}, TR={x:690,y:311};
const P1={del:{x:530,y:140}, andel:{x:455,y:268}, dot:{x:530,y:268}, hel:{x:605,y:268}, bar:{x:530,y:196,w:168}};
let L1=null, T1=null, triPath=null, L2=[], built=false;

function makeLine1(o){
  const pl=layout1([{w:'Andel'},{w:'='},{n:{w:'Del'},d:{w:'Hel'}}],Y11);
  return {
    andel:word(S1,'Andel','cO',pl[0].x,pl[0].y,o),
    eq:word(S1,'=','',pl[1].x,pl[1].y,o),
    del:word(S1,'Del','cA',pl[2].n.x,pl[2].n.y,o),
    bar:hbar(S1,pl[2].bar.w,pl[2].bar.x,pl[2].bar.y,o),
    hel:word(S1,'Hel','cB',pl[2].d.x,pl[2].d.y,o),
  };
}
function makeTri(){
  triPath=mk('path',{class:'tri',d:`M${TL.x} ${TL.y} L${TA.x} ${TA.y} L${TR.x} ${TR.y} Z`});
  S1.layer.insertBefore(triPath,S1.layer.firstChild);
  return triPath;
}
function home(ob,p){ob.hx=p.x;ob.hy=p.y;if(p.w)ob.hw=p.w;}
function buildInstant(){
  S1.layer.innerHTML=''; L2=[];
  L1=makeLine1(1);
  makeTri();
  T1={andel:word(S1,'Andel','cO',P1.andel.x,P1.andel.y,1), del:word(S1,'Del','cA',P1.del.x,P1.del.y,1),
     hel:word(S1,'Hel','cB',P1.hel.x,P1.hel.y,1), dot:word(S1,'·','',P1.dot.x,P1.dot.y,1), bar:hbar(S1,P1.bar.w,P1.bar.x,P1.bar.y,1)};
  for(const k in T1) home(T1[k],P1[k]);
  built=true;
}
// back to the definition and the full triangle, with the second row gone
async function resetBase(){
  if(!built){buildInstant();return;}
  S1.layer.querySelectorAll('.ring').forEach(r=>r.parentNode.remove());
  const l1=makeLine1(1), old=L1; for(const k in old) old[k].kill(); L1=l1;
  triPath.style.strokeDasharray=''; triPath.style.strokeDashoffset='';
  const jobs=[];
  for(const k in T1){const ob=T1[k]; hot(ob,false); ob.x=ob.hx; ob.y=ob.hy; ob.s=1; ob.r=0; if(ob.kind==='b') ob.w=ob.hw; ob.ap(); jobs.push(anim(ob,{o:1},900));}
  const gone=L2; L2=[];
  gone.forEach(ob=>jobs.push(anim(ob,{o:0},700).then(()=>ob.kill())));
  await all(jobs);
}
async function copyTo1(src,p,extra={}){
  const c=clone(src); L2.push(c);
  await anim(c,{o:1},500);
  await anim(c,Object.assign({x:p.x,y:p.y},extra),1250);
  return c;
}
async function buildFromDefinition(){
  await clearLayer(S1); L1=null; T1=null; triPath=null; L2=[]; built=false;
  L1=makeLine1(0);
  await all(Object.values(L1).map(o=>anim(o,{o:1},1000)));
  await S1.wait(1100);
  // the triangle is drawn like a pen stroke
  const path=makeTri(); const len=path.getTotalLength();
  path.style.strokeDasharray=len; path.style.strokeDashoffset=len;
  await S1.tween(2000,p=>path.style.strokeDashoffset=len*(1-p));
  path.style.strokeDasharray=''; path.style.strokeDashoffset='';
  await S1.wait(800);
  // copy the whole definition and move it into the bottom left corner
  const K={}; for(const k in L1) K[k]=clone(L1[k]);
  await all(Object.values(K).map(o=>anim(o,{o:1},500)));
  const dx=P1.andel.x-L1.andel.x, dy=P1.andel.y-L1.andel.y;
  await all(Object.values(K).map(o=>anim(o,{x:o.x+dx,y:o.y+dy},1500)));
  await S1.wait(1000);
  // split: andel stays, del to the top, hel to the bottom right (the small "=" and bar fade)
  await all([anim(K.del,{x:P1.del.x,y:P1.del.y},1500), anim(K.hel,{x:P1.hel.x,y:P1.hel.y},1500), anim(K.eq,{o:0},800), anim(K.bar,{o:0},800)]);
  K.eq.kill(); K.bar.kill();
  await S1.wait(1000);
  // a bar grows across the middle, then the dot appears between the bottom two
  K.bar=hbar(S1,0,P1.bar.x,P1.bar.y,1);
  await anim(K.bar,{w:P1.bar.w},1300);
  await S1.wait(800);
  const dot=word(S1,'·','',P1.dot.x,P1.dot.y,0);
  await anim(dot,{o:1},1000);
  await S1.wait(1300);
  T1={andel:K.andel,del:K.del,hel:K.hel,bar:K.bar,dot};
  for(const k in T1) home(T1[k],P1[k]);
  built=true;
}
const SOLVE1={
  andel:{fade:['andel','dot'], use:['del','bar','hel'], row:[{w:'Andel'},{w:'='},{n:{w:'Del'},d:{w:'Hel'}}]},
  del:  {fade:['del','bar'],   use:['andel','dot','hel'], row:[{w:'Del'},{w:'='},{w:'Andel'},{w:'·'},{w:'Hel'}]},
  hel:  {fade:['hel','dot'],   use:['del','bar','andel'], row:[{w:'Hel'},{w:'='},{n:{w:'Del'},d:{w:'Andel'}}]},
};
async function solve1(k){
  const SV=SOLVE1[k], pl=layout1(SV.row,Y12);
  const spots=[pl[0],pl[1]];
  if(pl[2].frac) spots.push(pl[2].n,pl[2].bar,pl[2].d); else spots.push(pl[2],pl[3],pl[4]);
  await copyTo1(L1[k],spots[0]);
  await S1.wait(700);
  let r=await highlight(T1[k]);
  await S1.wait(500);
  await all([unhighlight(T1[k],r), ...SV.fade.map(f=>anim(T1[f],{o:.2},1100))]);
  await S1.wait(900);
  await copyTo1(L1.eq,spots[1]);
  await S1.wait(800);
  for(let i=0;i<3;i++){
    const src=T1[SV.use[i]], to=spots[2+i];
    r=await highlight(src);
    await copyTo1(src,to,src.kind==='b'?{w:to.w}:{});
    await unhighlight(src,r);
    await S1.wait(600);
  }
  await S1.wait(400);
  await all(L2.map(o=>swell(o,1300)));
}

const S2=makeStage('st2');
const X0=24, Y0=238, DY=84, FS=24;
// item builders for a row
const W=(w,c,k,fs)=>({w:String(w),c:c||'',k,fs});
const E=k=>W('=','',k);
const DOT=k=>W('·','',k);
const SL=k=>W('/','',k,34);
const F=(n,d,k)=>({n,d,k});
const FP=(a,b,c,k)=>({fr:[String(a),String(b)],c,k});
const PD=(n,cols,c,k)=>{const gap=cols>=n?12:11, r=cols>=n?4.5:4; return {pic:(S,x,y)=>dots(S,n,cols,gap,r,x,y,0,c), pw:(cols-1)*gap+2*r, k};};
const PP=(a,b,k)=>({pic:(S,x,y)=>pie(S,a,b,17,x,y,0,'cO'), pw:34, k});
const RED=(p,a,b,f,ca='',cb='')=>F([W(a,ca,p+'a'),W('/','',p+'s',30),W(f,'cF',p+'f')],[W(b,cb,p+'b'),W('/','',p+'t',30),W(f,'cF',p+'g')],p+'L');
const redSteps=(p,sa,sb)=>[['fly',sa,p+'a'],['fly',sb,p+'b'],['show',[p+'L']],['wait',500],['show',[p+'s',p+'f',p+'t',p+'g']],['wait',1100]];

let AUTO=0;
function itemW(S,it,fs){
  if(it.n) return Math.max(inW(S,it.n,fs),inW(S,it.d,fs))+16;
  if(it.fr) return Math.max(S.measure(it.fr[0],fs),S.measure(it.fr[1],fs))+14;
  if(it.pic) return it.pw;
  return Math.max(S.measure(fmt(it.w),it.fs||fs),it.mw?S.measure(it.mw,it.fs||fs):0);
}
function inW(S,l,fs){return l.reduce((a,t)=>a+itemW(S,t,fs),0)+6*(l.length-1);}
function placeIn(S,l,cx,y,fs,K){
  let x=cx-inW(S,l,fs)/2; const objs=[];
  l.forEach(t=>{const w=itemW(S,t,fs); objs.push(place(S,t,x+w/2,y,fs,K)); x+=w+6;});
  return objs;
}
function place(S,it,cx,y,fs,K){
  const k=it.k||('_'+(AUTO++)); let ob;
  if(it.n){
    ob=hbar(S,itemW(S,it,fs)-4,cx,y,0);
    const a=placeIn(S,it.n,cx,y-.92*fs,fs,K), b=placeIn(S,it.d,cx,y+fs,fs,K);
    K[k+'*']=[ob,...a,...b];
  }
  else if(it.fr) ob=fpic(S,it.fr[0],it.fr[1],it.c||'',cx,y,0,fs);
  else if(it.pic) ob=it.pic(S,cx,y);
  else ob=word(S,fmt(it.w),it.c||'',cx,y,0,it.fs||fs);
  K[k]=ob; return ob;
}
function buildRow(S,items,x0,y,fs,K){
  let x=x0;
  items.forEach((it,i)=>{if(i) x+=14; const w=itemW(S,it,fs); place(S,it,x+w/2,y,fs,K); x+=w;});
  return x;
}

function substitute(ex,rows,steps){

    if(ex.g==='dots'){
      r0.push(F([PD(ex.d,ex.d,'cA','sD')],[PD(ex.h,ex.h,'cB','sH')],'sb'));

      r0.push(E('e3'),F([W(ex.d,'cA','nD')],[W(ex.h,'cB','nH')],'nb'));
      steps.push(['show',['e3','nb']],['fly','sD','nD'],['fly','sH','nH'],['wait',1000]);
    }else{
      r0.push(F([W(ex.d,'cA','nD')],[W(ex.h,'cB','nH')],'nb'));
      steps.push(['flyh','G:D','nD','p0'],['showh',['nb'],'p1'],['flyh','G:H','nH','p2'],['wait',1000]);
    }

    const [a,b]=ex.a;

      r0.push(E('e3'),FP(a,b,'cO','nA'),DOT('n1'),W(ex.h,'cB','nH'));
      steps.push(['show',['e3']],['fly','sA','nA'],['show',['n1']],['fly','sH','nH'],['wait',1000]);
    }else{
      r0.push(FP(a,b,'cO','nA'),DOT('n1'),W(ex.h,'cB','nH'));
      steps.push(['flyh','G:A','nA','p0'],['showh',['n1'],'p1'],['flyh','G:H','nH','p2'],['wait',1000]);
    }
  }else{
    const [a,b]=ex.a;
    if(ex.g==='pie'){
      r0.push(PD(ex.d,4,'cA','sD'),SL('s1'),PP(a,b,'sA'));
      steps.push(['flyh','G:D','sD','p0'],['showh',['s1'],'p1'],['flyh','G:A','sA','p2'],['wait',1000]);
      r0.push(E('e3'),W(ex.d,'cA','nD'),SL('n1'),FP(a,b,'cO','nA'));

      steps.push(['flyh','G:D','nD','p0'],['showh',['n1'],'p1'],['flyh','G:A','nA','p2'],['wait',1000]);

}

/* --- working it out with fractions --- */
// p/b = res: a one-digit denominator is simply divided; a larger one is reduced to res/1
function divideTail(p,b,res,rows,steps){
  if(b<10){
    rows[rows.length-1].push(E('w4'),W(res,'','q'));
    steps.push(['wig',['vL*']],['show',['w4']],['show',['q']],['wig',['q']]);
    return;
  }
  reduceTail(p,b,res,rows,steps);
}
function reduceTail(p,b,res,rows,steps){
  rows.push([E('w0'),RED('r',p,b,b),E('w1'),F([W(res,'','w2')],[W('1','','w3')],'wL'),E('w4'),W(res,'','q')]);
  steps.push(['show',['w0']],...redSteps('r','v1','v2'),['show',['w1','wL*']],['wait',1000],['show',['w4']],['fly','w2','q'],['wig',['q']]);
}
function fracTail(ex,rows,steps){
  if(ex.t==='andel'){
    // reduce, one factor at a time
    const items=[]; let n=ex.d, m=ex.h, cn='cA', cm='cB', sn='nD', sm='nH';
    ex.f.forEach((f,i)=>{
      const p='r'+i;
      items.push(E(p+'e'),RED(p,n,m,f,cn,cm),E(p+'e2'));
      n/=f; m/=f;
      items.push(F([W(n,'',p+'n')],[W(m,'',p+'m')],p+'q'));
      steps.push(['show',[p+'e']],...redSteps(p,sn,sm),['show',[p+'e2']],['show',[p+'q*']],['wait',1100]);
      sn=p+'n'; sm=p+'m'; cn=''; cm='';
    });
    rows.push(items);
    steps.push(['wig',['r'+(ex.f.length-1)+'q*']]);
  }else if(ex.t==='del'){
    // a/b · h = a/b · h/1 = (a · h)/(b · 1)
    const [a,b]=ex.a, h=ex.h, p=a*h, res=p/b;
    rows[rows.length-1].push(E('m0'),F([W(a,'cO','m1')],[W(b,'cO','m2')],'mA'),DOT('m3'),F([W(h,'cB','m4')],[W('1','cF','m5')],'mH'));
    steps.push(['show',['m0']],['fly','nA','mA*'],['show',['m3']],['fly','nH','m4'],['show',['mH']],['show',['m5']],['wait',1100]);
    rows.push([E('u0'),F([W(a,'','u1'),W('·','','u2'),W(h,'','u3')],[W(b,'','u4'),W('·','','u5'),W('1','','u6')],'uL'),E('v0'),F([W(p,'','v1')],[W(b,'','v2')],'vL')]);
    steps.push(['show',['u0','uL']],['fly','m1','u1'],['show',['u2']],['fly','m4','u3'],['wait',400],['fly','m2','u4'],['show',['u5']],['fly','m5','u6'],['wait',1000],
               ['show',['v0','vL']],['show',['v1']],['show',['v2']],['wait',1000]);
    divideTail(p,b,res,rows,steps);
  }else{
    // d / (a/b) = d/1 · b/a
    const [a,b]=ex.a, d=ex.d, p=d*b, res=p/a;
    rows[rows.length-1].push(E('m0'),F([W(d,'cA','m1')],[W('1','cF','m2')],'mD'),W('·','cF','m3'),F([W(b,'cO','m4')],[W(a,'cO','m5')],'mA'));
    steps.push(['show',['m0']],['fly','nD','m1'],['show',['mD']],['show',['m2']],['wait',600],['fly','n1','m3'],['flip','nA','mA'],['wait',1100]);
    rows.push([E('u0'),F([W(d,'','u1'),W('·','','u2'),W(b,'','u3')],[W('1','','u4'),W('·','','u5'),W(a,'','u6')],'uL'),E('v0'),F([W(p,'','v1')],[W(a,'','v2')],'vL')]);
    steps.push(['show',['u0','uL']],['fly','m1','u1'],['show',['u2']],['fly','m4','u3'],['wait',400],['fly','m2','u4'],['show',['u5']],['fly','m5','u6'],['wait',1000],
               ['show',['v0','vL']],['show',['v1']],['show',['v2']],['wait',1000]);
    divideTail(p,a,res,rows,steps);
  }
}
/* --- working it out in decimal form, with a calculator --- */
function decTail(ex,rows,steps){
  if(ex.t==='andel'){
    const v=ex.d/ex.h, full=cs(v), dec=(full.split(',')[1]||'');
    if(dec.length>4){
      const short=full.slice(0,full.indexOf(',')+5)+'…', ap=cs(Math.round(v*100)/100);
      rows.push([E('d0'),W(short,'','q0'),W('≈','','ap'),W(ap,'','q')]);
      steps.push(['calc',`${ex.d} / ${ex.h}`,full,'q0','d0'],['show',['ap']],['show',['q']],['wig',['q']]);
    }else{
      rows.push([E('d0'),W(full,'','q')]);
      steps.push(['calc',`${ex.d} / ${ex.h}`,full,'q','d0'],['wig',['q']]);
    }
  }else if(ex.t==='del'){
    const [a,b]=ex.a, dv=cs(a/b), res=cs(a*ex.h/b);
    rows.push([E('d0'),W(dv,'cO','d1'),DOT('d2'),W(ex.h,'cB','d3'),E('d4'),W(res,'','q')]);
    steps.push(['calc',`${a} / ${b}`,dv,'d1','d0'],['show',['d2']],['fly','nH','d3'],['wait',700],['calc',`${dv} · ${ex.h}`,res,'q','d4'],['wig',['q']]);
  }else{
    const [a,b]=ex.a, dv=cs(a/b), res=cs(ex.d*b/a);
    rows.push([E('d0'),W(ex.d,'cA','d1'),SL('d2'),W(dv,'cO','d3'),E('d4'),W(res,'','q')]);
    steps.push(['show',['d0']],['fly','nD','d1'],['fly','n1','d2'],['calc',`${a} / ${b}`,dv,'d3',null],['wait',500],['calc',`${ex.d} / ${dv}`,res,'q','d4'],['wig',['q']]);
  }
}

/* --- the given: a picture or a short line, and naming its parts --- */
async function ident(S,ob,name,cls,side){
  const r=ring(ob);
  await all([anim(r,{o:1},600),swell(ob,1100)]);
  recolor(ob,cls);
  const lx=side?ob.x+(ob.cx||0)+ob.w/2+14+S.measure(name,16)/2:ob.x+(ob.cx||0);
  const ly=side?ob.y:ob.y+ob.h/2+18;
  const L=word(S,name,cls,lx,ly,0,16);
  await anim(L,{o:1},800);
  await S.wait(500);
  await anim(r,{o:0},500); r.kill();
  await S.wait(600);
  return L;
}
async function setupGiven(ex,G){
  const S=S2, Y=110;
  if(ex.g==='dots'){
    G.H=dots(S,ex.h,4,26,8,100,Y);
    await anim(G.H,{o:1},900); await S.wait(1000);
    // take two of them and copy them to the side
    G.D=dots(S,ex.d,ex.d,26,8,100-39+13,Y-13);
    await anim(G.D,{o:1},500);
    await anim(G.D,{x:250,y:Y},1400); await S.wait(900);
    await ident(S,G.D,'Del','cA'); await ident(S,G.H,'Hel','cB');
  }else if(ex.g==='pie'){
    const [a,b]=ex.a;
    G.A=pieFr(S,a,b,96,Y);
    if(ex.t==='del') G.H=dots(S,ex.h,5,18,6,300,Y);
    else{
      // the whole is drawn already, but the last column is hidden until the end
      G.D=dots(S,ex.d/a*b,b,20,7,300,Y);
      G.D.cs.forEach((c,i)=>{if(i%b>=a) c.style.opacity=0;});
    }
    const other=G.H||G.D;
    await all([anim(G.A,{o:1},900),anim(other,{o:1},900)]); await S.wait(1100);
    await ident(S,G.A,'Andel','cO');
    if(G.H) await ident(S,G.H,'Hel','cB'); else await ident(S,G.D,'Del','cA');
  }else{
    const K={}; let items;
    if(ex.t==='andel') items=[W(ex.d,'','D'),W('av'),W(ex.h,'','H')];
    else if(ex.t==='del') items=[FP(ex.a[0],ex.a[1],'','A'),W('av'),W(ex.h,'','H')];
    else items=[FP(ex.a[0],ex.a[1],'','A'),W('av'),Object.assign(W('?','','Q'),{mw:String(ex.d*ex.a[1]/ex.a[0])}),W('='),W(ex.d,'','D')];
    buildRow(S,items,X0,Y,FS,K);
    Object.assign(G,{A:K.A,D:K.D,H:K.H,Q:K.Q});
    const objs=Object.keys(K).filter(k=>!k.endsWith('*')).map(k=>K[k]);
    await all(objs.map(o=>anim(o,{o:1},900))); await S.wait(1100);
    if(ex.t==='andel'){await ident(S,G.D,'Del','cA'); await ident(S,G.H,'Hel','cB');}
    else if(ex.t==='del'){await ident(S,G.A,'Andel','cO'); await ident(S,G.H,'Hel','cB');}
    else{await ident(S,G.A,'Andel','cO'); await ident(S,G.D,'Del','cA'); await ident(S,G.Q,'Hel','cB');}
  }
}
async function ending(ex,K,G){
  const S=S2;
  if(ex.t==='del' && ex.g==='pie'){
    // check: the shaded share of the dots is the part
    const [a,b]=ex.a;
    await S.wait(600);
    G.H.cs.forEach((c,i)=>{if(i%b>=b-a) c.setAttribute('class','dt cA');});
    await S.wait(800);
    const L=word(S,'Del','cA',G.H.x+G.H.w/2+30,G.H.y,0,16);
    await all([anim(L,{o:1},800),swell(G.H,1300)]);
  }else if(ex.t==='hel' && ex.g==='pie'){
    // check: the missing parts appear, and all the dots are the whole
    const [a,b]=ex.a, hid=G.D.cs.filter((c,i)=>i%b>=a);
    await S.wait(600);
    hid.forEach(c=>c.setAttribute('class','dt'));
    await S.tween(1000,p=>hid.forEach(c=>c.style.opacity=p));
    await S.wait(500);
    const fr=new O(S); fr.x=G.D.x; fr.y=G.D.y; fr.o=1; fr.ap();
    const rect=mk('rect',{x:-G.D.w/2-9,y:-G.D.h/2-9,width:G.D.w+18,height:G.D.h+18,rx:12,class:'whole'},fr.g);
    const len=rect.getTotalLength(); rect.style.strokeDasharray=len; rect.style.strokeDashoffset=len;
    await S.tween(1400,p=>rect.style.strokeDashoffset=len*(1-p));
    const L=word(S,'Hel','cB',G.D.x+G.D.w/2+36,G.D.y,0,16);
    await all([anim(L,{o:1},800),swell(G.D,1300)]);
  }else if(ex.t==='hel'){
    // the answer takes the place of the question mark
    await S.wait(600);
    const c=clone(K.q); await anim(c,{o:1},450);
    await anim(c,{x:G.Q.x,y:G.Q.y},1300);
    await all([anim(G.Q,{o:0},600)]);
    recolor(c,'cB'); await swell(c,1300);
  }
}

/* --- calculator --- */
async function calcStep(ctx,expr,res,dstKey,eqKey){
  const {S,K}=ctx;
  if(!ctx.C){ctx.C=calcObj(S,628,335); await anim(ctx.C,{o:1},800); await S.wait(300);}
  const C=ctx.C;
  if(ctx.CR){await anim(ctx.CR,{o:0},400); ctx.CR.kill(); ctx.CR=null;}
  C.ex.textContent='';
  const ring_=ring(C);
  await all([anim(ring_,{o:1},700),swell(C,1100)]);
  await S.wait(300);
  for(const ch of fmt(expr)){C.ex.textContent+=ch; await S.wait(ch===' '?80:220);}
  await S.wait(700);
  const rs=fmt(res), w=S.measure(rs,17);
  const r=word(S,rs,'',C.x+56-w/2,C.y-48,0,17); ctx.CR=r;
  await anim(r,{o:1},700); await S.wait(600);
  await anim(ring_,{o:0},500); ring_.kill();
  await S.wait(400);
  if(eqKey) await anim(K[eqKey],{o:1},700);
  await fly(r,K[dstKey]);
  await S.wait(700);
}

// a copy of a/b glides to its place, then a and b trade places in arcs, one on each side of the bar
async function flip(src,grp){
  const S=src.S, fs=src.fs, [a,b]=src.str.split('/');
  const top=word(S,a,src.cls,src.x,src.y-.92*fs,0,fs), bot=word(S,b,src.cls,src.x,src.y+fs,0,fs), bar=hbar(S,src.w-14,src.x,src.y,0);
  const parts=[top,bot,bar];
  await all(parts.map(o=>anim(o,{o:1},450)));
  const tgt=grp[0], dx=tgt.x-src.x, dy=tgt.y-src.y;
  await all([...parts.map(o=>anim(o,{x:o.x+dx,y:o.y+dy},1200)),anim(bar,{w:tgt.w},1200)]);
  await S.wait(400);
  const cx=tgt.x, yt=top.y, yb=bot.y, R=Math.max(top.w,bot.w)/2+16;
  await S.tween(1500,p=>{
    const sx=R*Math.sin(Math.PI*p);
    top.x=cx+sx; top.y=yt+(yb-yt)*p; top.ap();
    bot.x=cx-sx; bot.y=yb-(yb-yt)*p; bot.ap();
  });
  grp.forEach(o=>{o.o=1;o.ap();});
  parts.forEach(o=>o.kill());
}

async function runSteps(ctx,steps){
  const {S,K,G}=ctx;
  const ref=s=>s.startsWith('G:')?G[s.slice(2)]:K[s];
  const keys=l=>l.flatMap(k=>k.endsWith('*')?K[k]:[K[k]]);
  for(const [op,a,b,c,d] of steps){
    if(op==='show') await all(keys(a).map(o=>anim(o,{o:1},b||900)));
    else if(op==='fly') await fly(ref(a),K[b]);
    else if(op==='wait') await S.wait(a);
    else if(op==='wig') await all(keys(a).map(o=>swell(o,1300)));
    else if(op==='calc') await calcStep(ctx,a,b,c,d);
    else if(op==='flyh'){const r=await highlight(K[c]); await fly(ref(a),K[b]); await unhighlight(K[c],r);}
    else if(op==='flip') await flip(ref(a),K[b+'*']);
    else if(op==='showh'){const r=await highlight(K[b]); await all(keys(a).map(o=>anim(o,{o:1},900))); await unhighlight(K[b],r);}
  }
}

async function runEx(i){
  const S=S2, ex=EX[i], t=ex.t, K={}, G={}, ctx={S,K,G};
  await clearLayer(S);
  // the small triangle, and the task
  const tri=mk('path',{class:'tri',d:'M588 104 L640 16 L692 104 Z'},S.layer); tri.style.opacity=0;
  const T={D:word(S,'D','cA',640,52,0,18), bar:hbar(S,46,640,69,0), A:word(S,'A','cO',614,89,0,18), dot:word(S,'·','',640,89,0,18), H:word(S,'H','cB',666,89,0,18)};
  const words=SENT[t], sp=S.measure('a',22); let x=X0; const SW=[];
  words.forEach((s,j)=>{if(j&&s!=='.') x+=sp; const w=S.measure(s,22); SW.push(word(S,s,'',x+w/2,36,0,22)); x+=w;});
  await all([S.tween(1000,p=>tri.style.opacity=p),...Object.values(T).map(o=>anim(o,{o:1},1000)),...SW.map(o=>anim(o,{o:1},1000))]);
  await S.wait(900);

  // the definition goes on its own row under the triangle, ending at the right edge
  const def=ROW1[t]();
  const dw=def.reduce((a,it)=>a+itemW(S,it,FS),0)+14*(def.length-1);
  buildRow(S,def,700-dw,160,FS,K);
  // the working (built hidden, revealed piece by piece) starts at the left
  const rows=[[W(NAME[t][0],NAME[t][1],'c0'),E('ce')]], steps=[];
  substitute(ex,rows,steps);
  (METHOD==='d'?decTail:fracTail)(ex,rows,steps);
  buildRow(S,rows[0],X0,Y0,FS,K);
  const xeq=K.ce.x-K.ce.w/2;
  rows.slice(1).forEach((r,j)=>buildRow(S,r,xeq,Y0+(j+1)*DY,FS,K));

  // the given, and what its parts are called
  await setupGiven(ex,G);

  // the word in the task is copied down to start the definition
  const tw=SW[SENT_T[t]];
  let r=ring(tw); await all([anim(r,{o:1},600),swell(tw,1100)]);
  await fly(tw,K.t);
  await anim(r,{o:0},500); r.kill();
  await S.wait(700);

  // a faded copy of it goes to its letter in the triangle, and that letter (with the operation next to it) fades
  const L=TLET[t], gh=clone(K.t);
  await anim(gh,{o:.45},500);
  await anim(gh,{x:T[L].x,y:T[L].y,s:.75},1300);
  await all([anim(gh,{o:0},900),...FADE2[t].map(f=>anim(T[f],{o:.2},1000))]);
  gh.kill();
  await S.wait(700);
  // read the rest off the triangle
  await anim(K.e1,{o:1},700); await S.wait(500);
  for(let j=0;j<3;j++){
    const src=T[USE2[t][j]];
    r=await highlight(src);
    await fly(src,K['p'+j]);
    await unhighlight(src,r);
    await S.wait(500);
  }
  await S.wait(900);

  // the working: the name we look for is copied from the definition, then the values
  r=await highlight(K.t);
  await fly(K.t,K.c0);
  await unhighlight(K.t,r);
  await anim(K.ce,{o:1},700); await S.wait(600);

  await runSteps(ctx,steps);
  await ending(ex,K,G);
}

/* =====================================================================
   running, pausing, spotlight
   ===================================================================== */
let RUN=0, running=false, last1=null, last2=null;
const pps=[document.getElementById('pp1'),document.getElementById('pp2')];
function setPaused(v){paused=v;pps.forEach(pp=>{pp.setAttribute('aria-pressed',v);pp.textContent=v?'▶':'❚❚';pp.setAttribute('aria-label',v?'play':'pause');});}
let liftTimer=null;
function focusOn(sec,on){
  clearTimeout(liftTimer);
  if(on){
    document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('active',s===sec));
    document.body.classList.add('focusing');
  }else{
    // the card keeps its place above the dimmer until the dimmer has faded away
    document.body.classList.remove('focusing');
    liftTimer=setTimeout(()=>sec.classList.remove('active'),2200);
  }
}
async function go(n,job){
  const id=++RUN; STAGES.forEach(S=>S.tws=[]); running=true;
  setPaused(false);
  const sec=document.getElementById('sec'+n);
  document.getElementById('pp'+n).hidden=false; document.getElementById('rp'+n).hidden=false;
  focusOn(sec,true);
  await document.fonts.ready;
  if(id!==RUN) return false;
  await job();
  if(id!==RUN) return false;
  running=false;
  setTimeout(()=>{if(id===RUN&&!running) focusOn(sec,false);},1300);
  return true;
}
// stage 1
const btns1=[...document.querySelectorAll('#sec1 .exs button')];
async function start1(k){
  last1=k;
  btns1.forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  const done=await go(1,async()=>{
    if(k==='andel') await buildFromDefinition(); else await resetBase();
    await solve1(k);
  });
  if(done && k==='andel') btns1.forEach(b=>b.disabled=false);
}
btns1.forEach(b=>b.addEventListener('click',()=>{if(!b.disabled) start1(b.dataset.k);}));
document.getElementById('rp1').addEventListener('click',()=>{if(last1) start1(last1);});

// stage 2: buttons, three rows, each marked with the triangle letter it finds
const exs2=document.getElementById('exs2');
const fr=(a,b,c)=>`<span class="mf ${c||''}"><span>${a}</span><span>${b}</span></span>`;
function dotsSvg(n,cols,col){
  const rows=Math.ceil(n/cols), g=9, w=cols*g, h=rows*g; let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  for(let i=0;i<n;i++) s+=`<circle cx="${(i%cols)*g+4.5}" cy="${Math.floor(i/cols)*g+4.5}" r="3.3" fill="var(${col(i)})"/>`;
  return s+'</svg>';
}
function pieSvg(k,n){
  const R=12, A=i=>-Math.PI/2+i*2*Math.PI/n; let s=`<svg width="28" height="28" viewBox="-14 -14 28 28">`;
  for(let i=0;i<k;i++) s+=`<path d="${sector(0,0,R,A(i),A(i+1))}" fill="var(--cO)" fill-opacity=".85"/>`;
  for(let i=0;i<n;i++) s+=`<line x1="0" y1="0" x2="${R*Math.cos(A(i))}" y2="${R*Math.sin(A(i))}" stroke="var(--ink)" stroke-opacity=".5"/>`;
  return s+`<circle r="${R}" fill="none" stroke="var(--ink)" stroke-width="1.4"/></svg>`;
}
function rowIcon(t){
  const c=l=>TLET[t]===l?({A:'a',D:'d',H:'h'})[l]:'m';
  return `<svg class="ric" viewBox="0 0 80 72" aria-hidden="true"><path class="gl" d="M40 3 L77 68 L3 68 Z"/><line class="gl" x1="23" y1="40" x2="57" y2="40"/>
    <text class="gt ${c('D')}" x="40" y="32" text-anchor="middle">D</text><text class="gt ${c('A')}" x="22" y="62" text-anchor="middle">A</text>
    <circle class="gd" cx="40" cy="57" r="2.4"/><text class="gt ${c('H')}" x="58" y="62" text-anchor="middle">H</text></svg>`;
}
function btnHTML(ex){
  if(ex.g==='dots') return dotsSvg(ex.h,4,i=>i<ex.d?'--cA':'--cB');
  if(ex.g==='pie') return ex.t==='del' ? pieSvg(...ex.a)+dotsSvg(ex.h,5,()=> '--cB') : pieSvg(...ex.a)+dotsSvg(ex.d,4,()=>'--cA');
  if(ex.t==='andel') return `<span class="kA">${ex.d}</span>av<span class="kB">${ex.h}</span>`;
  if(ex.t==='del') return `${fr(...ex.a,'kO')}av<span class="kB">${ex.h}</span>`;
  return `${fr(...ex.a,'kO')}av<span class="kB">?</span>=<span class="kA">${ex.d}</span>`;
}
['andel','del','hel'].forEach(t=>{
  const row=document.createElement('div'); row.className='erow'; row.innerHTML=rowIcon(t);
  EX.forEach((ex,i)=>{if(ex.t!==t) return; const b=document.createElement('button'); b.dataset.i=i; b.innerHTML=btnHTML(ex); row.appendChild(b);});
  exs2.appendChild(row);
});
const btns2=[...exs2.querySelectorAll('button')];
function start2(i){
  last2=i;
  btns2.forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
  go(2,()=>runEx(i));
}
btns2.forEach(b=>b.addEventListener('click',()=>start2(+b.dataset.i)));
document.getElementById('rp2').addEventListener('click',()=>{if(last2!==null) start2(last2);});
// fraction or decimal form
const mbtns=[...document.querySelectorAll('.meth button')];
function setMethod(m){
  METHOD=m; try{localStorage.setItem('adh-m',m);}catch(e){}
  mbtns.forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));
}
mbtns.forEach(b=>b.addEventListener('click',()=>{
  setMethod(b.dataset.m);
  if(last2!==null) start2(last2);   // the chosen method plays from the start
}));
// decimal mark
const dmb=[...document.querySelectorAll('.dmbox button')];
function setDM(m){
  DM=m; try{localStorage.setItem('adh-dm',m);}catch(e){}
  dmb.forEach(b=>b.setAttribute('aria-pressed',b.dataset.dm===m));
  document.querySelector('.dlab').textContent=fmt('0,25');
}
dmb.forEach(b=>b.addEventListener('click',()=>setDM(b.dataset.dm)));
setMethod(METHOD); setDM(DM);

pps.forEach(pp=>pp.addEventListener('click',()=>{if(running) setPaused(!paused);}));
document.addEventListener('keydown',e=>{
  if(e.code==='Space' && running && !(e.target instanceof HTMLButtonElement)){e.preventDefault();setPaused(!paused);}
});
</script>
